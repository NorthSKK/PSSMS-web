name: Full regression verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pssms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/pssms_test
      NODE_V8_COVERAGE: /tmp/pssms-v8-coverage
      JWT_SECRET: isolated-ci-test-secret-with-no-production-access
      MEDIA_STORAGE_DIR: /tmp/pssms-test-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize isolated database schema
        run: node -e "require('./lib/db').query(require('fs').readFileSync('db/schema.sql','utf8')).then(()=>require('./lib/db').pool.end()).catch(e=>{console.error(e);process.exit(1)})"
      - run: node -e "require('./db/migrate').runMigrations().then(()=>require('./lib/db').pool.end()).catch(e=>{console.error(e);process.exit(1)})"
      - run: npm test
        env:
          TZ: Asia/Bangkok
      - run: npm test
        env:
          TZ: UTC
      - name: Summarize exercised backend functions
        if: always()
        run: |
          node <<'JS'
          const fs=require('fs'),path=require('path');
          const root=process.cwd()+'/',files=new Map();
          for(const name of fs.readdirSync('/tmp/pssms-v8-coverage')){
            let data;try{data=JSON.parse(fs.readFileSync('/tmp/pssms-v8-coverage/'+name));}catch{continue;}
            for(const script of data.result||[]){
              const url=script.url.replace('file://','');if(!url.startsWith(root+'functions/'))continue;
              const key=url.slice(root.length),map=files.get(key)||new Map();files.set(key,map);
              for(const f of script.functions||[]){
                if(!f.functionName)continue;const id=f.functionName+':'+f.ranges[0].startOffset;
                map.set(id,{name:f.functionName,called:(map.get(id)?.called||false)||f.ranges[0].count>0});
              }
            }
          }
          const report=[...files].map(([file,map])=>({file,called:[...map.values()].filter(f=>f.called).map(f=>f.name),notCalled:[...map.values()].filter(f=>!f.called).map(f=>f.name)}));
          console.log('FUNCTION_COVERAGE '+JSON.stringify(report));
          fs.writeFileSync('/tmp/pssms-backend-coverage.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({files:report.length,called:report.reduce((n,r)=>n+r.called.length,0),notCalled:report.reduce((n,r)=>n+r.notCalled.length,0)}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-function-coverage
          path: /tmp/pssms-backend-coverage.json

name: Homeroom deployment verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pssms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/pssms_test
      JWT_SECRET: isolated-ci-test-secret-with-no-production-access
      MEDIA_STORAGE_DIR: ${{ runner.temp }}/pssms-test-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Initialize isolated database schema
        run: node -e "require('./lib/db').query(require('fs').readFileSync('db/schema.sql','utf8')).then(()=>require('./lib/db').pool.end()).catch(e=>{console.error(e);process.exit(1)})"
      - run: node -e "require('./db/migrate').runMigrations().then(()=>require('./lib/db').pool.end()).catch(e=>{console.error(e);process.exit(1)})"
      - run: npm test
        env:
          TZ: Asia/Bangkok
      - run: npm test
        env:
          TZ: UTC

<div class="container-fluid pssms-page pssms-dept-academic">
  <div class="pssms-page-header">
    <div>
      <h4><i class="fas fa-user-graduate me-2" style="color:var(--p-accent);"></i><span id="studentName">นักเรียน</span></h4>
      <p class="pssms-subtitle" id="studentSubtitle">กำลังโหลด...</p>
      <div class="small text-muted" id="studentIdentity">กำลังโหลดข้อมูล...</div>
    </div>
  </div>

  <!-- KPI strip -->
  <div class="row g-2 mb-3">
    <div class="col-6">
      <div class="pssms-card p-3 text-center">
        <div class="text-muted small">การมาเรียนเทอมนี้</div>
        <div class="fw-bold fs-4" id="studentAttendPct" style="color:var(--p-accent);">—</div>
      </div>
    </div>
    <div class="col-6">
      <div class="pssms-card p-3 text-center">
        <div class="text-muted small">เกรดเฉลี่ยเทอมนี้</div>
        <div class="fw-bold fs-4" id="studentGPA" style="color:var(--p-accent);">—</div>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md-6">
      <button type="button" class="pssms-card p-3 w-100 text-start border-0 h-100" onclick="loadPage('Page_Student_Savings')">
        <div class="d-flex justify-content-between gap-2"><div><div class="small text-muted mb-1"><i class="fas fa-piggy-bank me-1"></i>เงินออมของฉัน</div><div class="fw-bold" id="studentSavingsBalance" style="font-size:1.15rem;color:#b45309;">—</div><div class="small text-muted mt-1" id="studentSavingsDetail">กำลังโหลด...</div></div><i class="fas fa-chevron-right text-muted align-self-center"></i></div>
      </button>
    </div>
    <div class="col-md-6">
      <button type="button" class="pssms-card p-3 w-100 text-start border-0 h-100" onclick="loadPage('Page_Student_Clubs')">
        <div class="d-flex justify-content-between gap-2"><div><div class="small text-muted mb-1"><i class="fas fa-flag-checkered me-1"></i>ชุมนุมของฉัน</div><div class="small" id="studentClubPreview">กำลังโหลด...</div></div><i class="fas fa-chevron-right text-muted align-self-center"></i></div>
      </button>
    </div>
  </div>

  <!-- Next/Current class banner -->
  <div id="studentNextClassCard" class="pssms-card mb-3 overflow-hidden" style="background:var(--p-accent);border:none;">
    <div class="p-3 position-relative">
      <div style="position:absolute;right:-10px;top:-10px;opacity:.08;font-size:5rem;line-height:1;"><i class="fas fa-book-open"></i></div>
      <div class="text-white opacity-75 small mb-1" style="letter-spacing:.05em;text-transform:uppercase;">คาบเรียนถัดไป</div>
      <div id="studentNextClassTitle" class="fw-bold text-white" style="font-size:1.1rem;">กำลังตรวจสอบ...</div>
      <div id="studentNextClassDetail" class="text-white opacity-75 small mt-1"></div>
    </div>
  </div>

  <div class="pssms-card mb-3">
    <div class="pssms-card-header d-flex justify-content-between align-items-center"><span><i class="fas fa-calendar-alt me-2" style="color:var(--p-text-muted);"></i>กิจกรรมที่กำลังจะมาถึง</span><button type="button" class="btn btn-link btn-sm p-0" onclick="loadPage('Page_Student_Calendar')">ดูทั้งหมด</button></div>
    <div class="px-3 pb-2" id="studentEventsPreview"><div class="pssms-skel my-2" style="height:32px;border-radius:8px;"></div><div class="pssms-skel my-2" style="height:32px;border-radius:8px;"></div></div>
  </div>

  <!-- ตารางเรียนวันนี้ -->
  <div class="pssms-card mb-3">
    <div class="pssms-card-header"><span><i class="fas fa-calendar-day me-2" style="color:var(--p-text-muted);"></i>ตารางเรียนวันนี้</span></div>
    <div id="studentTodaySchedule" class="p-2">
      <div class="pssms-skel mb-2" style="height:44px;border-radius:8px;"></div>
      <div class="pssms-skel mb-2" style="height:44px;border-radius:8px;"></div>
      <div class="pssms-skel" style="height:44px;border-radius:8px;"></div>
    </div>
  </div>

  <!-- Score Feed -->
  <div class="pssms-card mb-3">
    <div class="pssms-card-header d-flex justify-content-between align-items-center">
      <span><i class="fas fa-clipboard-list me-2" style="color:var(--p-text-muted);"></i>คะแนนรายวิชา</span>
      <span class="badge bg-secondary" id="scoreFeedTermBadge"></span>
    </div>
    <div id="scoreFeedContainer" class="p-3">
      <div class="pssms-skel mb-2" style="height:44px;border-radius:8px;"></div>
      <div class="pssms-skel mb-2" style="height:44px;border-radius:8px;"></div>
      <div class="pssms-skel" style="height:44px;border-radius:8px;"></div>
    </div>
  </div>
</div>

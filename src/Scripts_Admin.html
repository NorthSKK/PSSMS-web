<script>
// ==========================================
// 0. Admin Dashboard
// ==========================================

function initAdminDashboard() {
  if (!document.getElementById('adminDashboardRoot')) return;
  var cached = _dashCacheGet('admin_bundle');
  if (cached) _renderAdminDashboard(cached);
  google.script.run
    .withSuccessHandler(function(bundle) {
      if (!bundle) return;
      _dashCacheSet('admin_bundle', bundle);
      _renderAdminDashboard(bundle);
    })
    .withFailureHandler(function(e) { console.error('admin bundle fail', e); })
    .getAdminDashboardBundle();

  // เรียกแยกจาก bundle โดยตั้งใจ — กระดานคำนวณทั้งโรงเรียน ไม่ควรถ่วงการเปิดแดชบอร์ด
  // ฝั่ง server แคชไว้ 10 นาที หน้าเต็มกับการ์ดนี้จึงใช้ผลการคำนวณชุดเดียวกัน
  _loadAdminProgressSummary();
  _loadSetupChecklist();
}

// ==========================================
// การ์ดตั้งค่าเริ่มต้น — ขึ้นเฉพาะตอนยังทำไม่ครบ แล้วหายเองถาวร
// ไม่บล็อกอะไร เป็นแค่ตัวบอกทางให้โรงเรียนใหม่ที่ login มาแล้วเจอหน้าเปล่า
// ==========================================
function _loadSetupChecklist() {
  var wrap = document.getElementById('adminSetupChecklist');
  if (!wrap) return;
  google.script.run
    .withSuccessHandler(function(d) {
      if (!d || !d.items) { wrap.classList.add('d-none'); return; }
      if (d.done >= d.total) { wrap.classList.add('d-none'); wrap.innerHTML = ''; return; }
      _renderSetupChecklist(wrap, d);
    })
    .withFailureHandler(function() { wrap.classList.add('d-none'); })
    .getSetupChecklist();
}

function _renderSetupChecklist(wrap, d) {
  var pct = Math.round((d.done / d.total) * 100);
  var rows = d.items.map(function(it) {
    var count = (it.count !== undefined && it.count > 0) ? ' <span class="text-muted">(' + it.count + ')</span>' : '';
    var icon = it.done
      ? '<i class="fas fa-check-circle" style="color:var(--p-accent);"></i>'
      : '<i class="far fa-circle text-muted"></i>';
    // ข้อที่ทำแล้วทำจาง ให้ข้อที่ยังเหลือเด่นขึ้นมาเอง
    var body = it.done
      ? '<span class="text-muted text-decoration-line-through">' + _escH(it.label) + '</span>' + count
      : '<b>' + _escH(it.label) + '</b>' + count +
        '<div class="small text-muted">' + _escH(it.hint) + '</div>';
    var go = it.done ? '' :
      '<button class="btn btn-soft btn-sm flex-shrink-0" onclick="loadPage(\'' + it.page + '\')">' +
      'ไปตั้งค่า <i class="fas fa-arrow-right ms-1"></i></button>';
    return '<li class="list-group-item d-flex align-items-center gap-2 px-0 bg-transparent border-0 py-1">' +
      '<span class="flex-shrink-0">' + icon + '</span>' +
      '<span class="flex-grow-1">' + body + '</span>' + go + '</li>';
  }).join('');

  wrap.innerHTML =
    '<div class="pssms-card p-3 mb-3">' +
      '<div class="d-flex align-items-center justify-content-between mb-2">' +
        '<div><b><i class="fas fa-list-check me-2" style="color:var(--p-accent);"></i>ตั้งค่าเริ่มต้นของโรงเรียน</b>' +
          '<div class="small text-muted">ทำครบแล้วการ์ดนี้จะหายไปเอง · ข้ามไปทำอย่างอื่นก่อนได้</div></div>' +
        '<span class="badge rounded-pill" style="background:var(--p-accent);">' + d.done + ' / ' + d.total + '</span>' +
      '</div>' +
      '<div class="progress mb-2" style="height:6px;">' +
        '<div class="progress-bar" role="progressbar" style="width:' + pct + '%;background:var(--p-accent);"></div>' +
      '</div>' +
      '<ul class="list-group list-group-flush mb-0">' + rows + '</ul>' +
    '</div>';
  wrap.classList.remove('d-none');
}

function _loadAdminProgressSummary() {
  var box = document.getElementById('adminProgressTotals');
  if (!box) return;
  google.script.run
    .withSuccessHandler(function(d) {
      if (!d || !d.totals) return;
      box.innerHTML = '';
      box.appendChild(_tpTotalBlock('เช็คชื่อ', d.totals.attendance, TP_UNITS.attendance));
      box.appendChild(_tpTotalBlock('ตั้งค่าวิชา', d.totals.config, TP_UNITS.config));
      box.appendChild(_tpTotalBlock('กรอกคะแนน', d.totals.scores, TP_UNITS.scores));
    })
    .withFailureHandler(function() {
      box.innerHTML = '<span class="small text-muted">โหลดยอดติดตามงานครูไม่สำเร็จ</span>';
    })
    .getTeacherProgressBoard();
}

function _renderAdminDashboard(bundle) {
  if (!document.getElementById('adminDashboardRoot')) return;

  // System config / subtitle
  var cfg = bundle.systemConfig && bundle.systemConfig.ok ? bundle.systemConfig.data : null;
  if (cfg) {
    var sub = document.getElementById('adminDashSubtitle');
    if (sub) sub.textContent = 'ภาคเรียนที่ ' + cfg.term + ' ปีการศึกษา ' + cfg.year;
    if (typeof renderTermProgressBar === 'function') renderTermProgressBar('adminTermProgress', cfg);
  }

  // Today students KPI (from morning activity)
  var todayStudents = bundle.todayStudents && bundle.todayStudents.ok ? bundle.todayStudents.data : null;
  if (todayStudents) {
    var elS = document.getElementById('adminKpiStudents');
    var elSsub = document.getElementById('adminKpiStudentsSub');
    if (elS) elS.textContent = todayStudents.present.toLocaleString() + ' คน';
    if (elSsub) elSsub.textContent = 'จาก ' + todayStudents.total + ' คน · คลิกดูรายชั้น →';
    window._adminTodayStudentsData = todayStudents;
  }

  // Staff stats KPI
  var stats = bundle.staffStats && bundle.staffStats.ok ? bundle.staffStats.data : null;
  if (stats) {
    var elStaff = document.getElementById('adminKpiStaff');
    var elStaffSub = document.getElementById('adminKpiStaffSub');
    var elL = document.getElementById('adminKpiLeave');
    var elSb = document.getElementById('adminKpiSub');
    var cardL = document.getElementById('adminKpiLeaveCard');
    var cardSb = document.getElementById('adminKpiSubCard');

    if (elStaff) elStaff.textContent = stats.staffPresent + ' คน';
    if (elStaffSub) elStaffSub.textContent = 'จากทั้งหมด ' + stats.totalStaff + ' คน';

    if (elL) {
      var lCount = stats.pendingLeaveCount || 0;
      elL.textContent = lCount + ' ใบ';
      if (cardL) cardL.style.borderLeft = lCount > 0 ? '3px solid var(--p-warning)' : '';
      if (lCount > 0) elL.style.color = 'var(--p-warning)';
    }
    if (elSb) {
      var sCount = stats.pendingSubstitutes || 0;
      elSb.textContent = sCount + ' คาบ';
      if (cardSb) cardSb.style.borderLeft = sCount > 0 ? '3px solid var(--p-warning)' : '';
      if (sCount > 0) elSb.style.color = 'var(--p-warning)';
    }

    _renderAdminPendingLeave(stats.pendingLeaveList || [], stats.pendingLeaveCount || 0);
  }

  // Calendar strip
  if (bundle.calendarEvents && bundle.calendarEvents.ok) {
    _renderAdminCalendarStrip(bundle.calendarEvents.data || []);
  }
}

function _showTodayStudentDetail() {
  var data = window._adminTodayStudentsData;
  if (!data) return;
  var _thM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var d = new Date(data.date);
  var dateLabel = d.getDate() + ' ' + _thM[d.getMonth()] + ' ' + (d.getFullYear() + 543);
  var rows = '';
  (data.byClass || []).forEach(function(r) {
    var pct = r.total > 0 ? Math.round(r.present / r.total * 100) : 0;
    var color = pct >= 80 ? 'var(--p-success,#22c55e)' : pct >= 60 ? 'var(--p-warning,#f59e0b)' : 'var(--p-danger,#ef4444)';
    rows += '<div class="d-flex align-items-center justify-content-between py-2 border-bottom">'
          + '<div class="fw-medium small">' + _escH(r.class) + '</div>'
          + '<div class="d-flex align-items-center gap-2">'
          + '<span class="small text-muted">' + r.present + '/' + r.total + '</span>'
          + '<span class="badge rounded-pill" style="background:' + color + ';min-width:44px;">' + pct + '%</span>'
          + '</div></div>';
  });
  if (!rows) rows = '<div class="text-center text-muted small py-3">ยังไม่มีข้อมูลเช็คชื่อวันนี้</div>';
  var modal = document.createElement('div');
  modal.id = 'adminStudentDetailModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:15px;';
  modal.innerHTML = '<div class="bg-white rounded-3 shadow-lg" style="width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;">'
    + '<div class="p-3 d-flex justify-content-between align-items-center border-bottom">'
    + '<div><div class="fw-bold"><i class="fas fa-flag me-2 text-primary"></i>เข้าแถววันนี้ รายชั้น</div>'
    + '<div class="small text-muted">' + dateLabel + ' · รวม ' + data.present + '/' + data.total + ' คน</div></div>'
    + '<button class="btn-close" onclick="document.getElementById(\'adminStudentDetailModal\').remove()"></button>'
    + '</div>'
    + '<div class="p-3" style="overflow-y:auto;">' + rows + '</div>'
    + '</div>';
  modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

function _renderAdminPendingLeave(list, total) {
  var el = document.getElementById('adminPendingLeaveList');
  if (!el) return;
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="text-center text-muted small py-3"><i class="fas fa-check-circle me-1 text-success"></i>ไม่มีใบลารอพิจารณา</div>';
    return;
  }
  var _thDays = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
  var html = '';
  list.forEach(function(r) {
    var d = r.start ? new Date(r.start) : null;
    var dayLabel = d ? _thDays[d.getDay()] + ' ' + r.start.slice(8,10) + '/' + r.start.slice(5,7) : '-';
    html += '<div class="d-flex align-items-center gap-2 p-2 rounded-2 mb-1" style="background:var(--p-subtle);">'
          + '<div class="text-center flex-shrink-0" style="width:42px;font-size:.7rem;color:var(--p-text-muted);">' + dayLabel + '</div>'
          + '<div class="flex-grow-1 overflow-hidden">'
          + '<div class="fw-medium small text-truncate">' + _escH(r.name) + '</div>'
          + '<div class="text-muted" style="font-size:.75rem;">' + _escH(r.type) + '</div>'
          + '</div>'
          + '</div>';
  });
  if (total > list.length) {
    html += '<div class="text-center small text-muted mt-1">และอีก ' + (total - list.length) + ' ใบ...</div>';
  }
  el.innerHTML = html;
}

function _renderAdminCalendarStrip(events) {
  var el = document.getElementById('adminCalendarStrip');
  if (!el) return;
  var today = new Date();
  today.setHours(0,0,0,0);
  var in14 = new Date(today.getTime() + 14*86400000);
  var _thM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var _thD = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
  var upcoming = (events || []).filter(function(e) {
    var d = new Date(e.start || e.date);
    return d >= today && d <= in14;
  }).slice(0, 7);

  if (upcoming.length === 0) {
    el.innerHTML = '<div class="text-center text-muted small py-3">ไม่มีกิจกรรมใน 14 วันข้างหน้า</div>';
    return;
  }
  var html = '';
  upcoming.forEach(function(e) {
    var d = new Date(e.start || e.date);
    var dateLabel = _thD[d.getDay()] + ' ' + d.getDate() + ' ' + _thM[d.getMonth()];
    var color = e.color || '#0d6efd';
    html += '<div class="d-flex align-items-center gap-2 p-2 rounded-2 mb-1" style="background:var(--p-subtle);">'
          + '<div style="width:4px;height:36px;border-radius:2px;background:' + color + ';flex-shrink:0;"></div>'
          + '<div class="flex-grow-1 overflow-hidden">'
          + '<div class="fw-medium small text-truncate">' + _escH(e.title || e.name || '') + '</div>'
          + '<div class="text-muted" style="font-size:.75rem;">' + dateLabel + '</div>'
          + '</div>'
          + '</div>';
  });
  el.innerHTML = html;
}

function _escH(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ==========================================
// 1. System Settings Logic
// ==========================================
let systemConfigHistory = {}; 

// 🌟 ตัวแปลงวันที่ให้เข้ากับช่อง Input ของเบราว์เซอร์ (ป้องกันปัญหาช่องว่าง)
function formatDateForInput(dateStr) {
  if (!dateStr) return "";
  try {
      const d = new Date(dateStr);
      if (isNaN(d)) return "";
      const tzOffset = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - tzOffset).toISOString().split('T')[0];
  } catch(e) { return ""; }
}

/**
 * อายุการใช้งานระบบบนหน้าตั้งค่า — อ่านอย่างเดียว ผู้ขายเป็นคนตั้ง
 * ⚠️ ไม่มีวันหมดอายุ (state 'none') = ซ่อนทั้งกล่อง ไม่ใช่ขึ้นว่า "ไม่จำกัด"
 * โรงเรียนที่จ่ายรายปีเห็นคำว่าไม่จำกัดแล้วจะเข้าใจผิดทันทีถ้าวันหนึ่งมีการตั้งค่า
 */
function loadLicenseInfo() {
  var wrap = document.getElementById('licenseInfoWrap');
  if (!wrap) return;
  google.script.run.withSuccessHandler(function (info) {
    if (!info || info.state === 'none' || !info.until) { wrap.classList.add('d-none'); return; }
    wrap.classList.remove('d-none');

    var d = document.getElementById('licenseUntilDisplay');
    var n = document.getElementById('licenseNoteDisplay');
    d.textContent = 'ใช้งานได้ถึง ' + thaiDateLabel(info.until);

    var left = info.daysLeft;
    if (info.state === 'locked') {
      d.style.color = 'var(--p-danger)';
      n.textContent = 'หมดอายุแล้ว ขณะนี้เป็นโหมดอ่านอย่างเดียว — พิมพ์ ปพ.5 และ export ยังใช้ได้';
    } else if (info.state === 'grace') {
      d.style.color = 'var(--p-danger)';
      n.textContent = 'เลยกำหนดแล้ว ยังบันทึกข้อมูลได้อีก ' + (info.graceDays + left) + ' วัน';
    } else if (info.state === 'warn') {
      d.style.color = 'var(--p-warning)';
      n.textContent = 'เหลืออีก ' + left + ' วัน — ติดต่อผู้ดูแลระบบเพื่อต่ออายุ';
    } else {
      d.style.color = 'var(--p-accent)';
      n.textContent = 'เหลืออีก ' + left + ' วัน';
    }
  }).withFailureHandler(function () {
    wrap.classList.add('d-none');   // อ่านไม่ได้ก็ไม่ต้องเดา
  }).getLicenseInfo();
}

/** 'YYYY-MM-DD' → '31 ต.ค. 2569' (พ.ศ.) */
function thaiDateLabel(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!m) return String(iso || '');
  var months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return Number(m[3]) + ' ' + months[Number(m[2]) - 1] + ' ' + (Number(m[1]) + 543);
}

function loadCurrentConfig() {
  loadLicenseInfo();
  showLoader(true);
  
  safeRun(3).withSuccessHandler(function(config) {
    showLoader(false);
    
    systemConfigHistory = config.termHistory || {};

    const termEl = document.getElementById('inputTerm');
    const yearEl = document.getElementById('inputYear');
    
    if(termEl) termEl.value = config.term || "1";
    if(yearEl) yearEl.value = config.year || "2568";

    // ผูก Event ให้ทำงานทันทีที่พิมพ์
    if(termEl) { termEl.removeEventListener('change', handleTermYearChange); termEl.addEventListener('change', handleTermYearChange); }
    if(yearEl) { yearEl.removeEventListener('input', handleTermYearChange); yearEl.addEventListener('input', handleTermYearChange); }

    const sDateInput = document.getElementById('inputStartDate');
    const eDateInput = document.getElementById('inputEndDate');

    // 🌟 ดึงข้อมูลล่าสุดมาใส่ (ผ่านตัวแปลงให้แสดงผลชัวร์ 100%)
    if (config.termStart) sDateInput.value = formatDateForInput(config.termStart);
    if (config.termEnd) eDateInput.value = formatDateForInput(config.termEnd);
    
    if(document.getElementById('currentTermDisplay')) document.getElementById('currentTermDisplay').innerText = `${config.term}/${config.year}`;
    if(document.getElementById('currentRangeDisplay')) document.getElementById('currentRangeDisplay').innerText = `${formatThaiDate(config.termStart)} ถึง ${formatThaiDate(config.termEnd)}`;

    // โหลดข้อมูลโรงเรียน
    if (config.schoolName && document.getElementById('inputSchoolName')) {
      document.getElementById('inputSchoolName').value = config.schoolName;
    }
    if (config.schoolLogo) {
      _settingsShowLogo(config.schoolLogo);
    }

    setTimeout(applyThaiDatePickers, 100);
  }).getSystemConfig();
}

var _logoBase64 = null;
var _logoFilename = '';

function previewLogoFile(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  _logoFilename = file.name;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX = 120;
      var w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        var r = Math.min(MAX / w, MAX / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      _logoBase64 = canvas.toDataURL('image/jpeg', 0.7);
      _settingsShowLogo(_logoBase64);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function _settingsShowLogo(src) {
  var img = document.getElementById('logoPreviewImg');
  var icon = document.getElementById('logoPlaceholderIcon');
  if (!img) return;
  img.src = src;
  img.style.display = 'block';
  if (icon) icon.style.display = 'none';
}

function clearLogo() {
  _logoBase64 = null;
  _logoFilename = '';
  var img = document.getElementById('logoPreviewImg');
  var icon = document.getElementById('logoPlaceholderIcon');
  var fi = document.getElementById('logoFileInput');
  if (img) { img.src = ''; img.style.display = 'none'; }
  if (icon) icon.style.display = '';
  if (fi) fi.value = '';
}

function saveSchoolInfoSettings() {
  var name = (document.getElementById('inputSchoolName') || {}).value || '';
  var statusEl = document.getElementById('logoSaveStatus');
  if (statusEl) { statusEl.className = 'mb-2 small p-2 rounded-2'; statusEl.style.cssText = 'background:var(--p-accent-soft);color:var(--p-accent);'; statusEl.textContent = 'กำลังบันทึก...'; }
  showLoader(true);
  google.script.run
    .withSuccessHandler(function(res) {
      showLoader(false);
      if (res.status === 'success') {
        if (statusEl) { statusEl.style.cssText = 'background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;'; statusEl.textContent = '✅ บันทึกสำเร็จ'; }
        // อัปเดต sidebar + localStorage
        if (res.logoUrl) {
          localStorage.setItem('pssms_school_logo', res.logoUrl);
          _applySchoolLogo(res.logoUrl);
        }
        if (name) {
          localStorage.setItem('pssms_school_name', name);
          _applySchoolName(name);
        }
        _logoBase64 = null;
      } else {
        if (statusEl) { statusEl.style.cssText = 'background:#fef2f2;color:#991b1b;border:1px solid #fecaca;'; statusEl.textContent = '❌ ' + (res.message || 'เกิดข้อผิดพลาด'); }
      }
    })
    .withFailureHandler(function(err) {
      showLoader(false);
      if (statusEl) { statusEl.style.cssText = 'background:#fef2f2;color:#991b1b;border:1px solid #fecaca;'; statusEl.textContent = '❌ ' + (err.message || 'เกิดข้อผิดพลาด'); }
    })
    .saveSchoolInfo(name, _logoBase64 || '', _logoFilename);
}

// 🌟 ฟังก์ชันทำงานเมื่อพิมพ์ปีการศึกษาหรือเปลี่ยนเทอม
function handleTermYearChange() {
  const t = document.getElementById('inputTerm').value.trim();
  const y = document.getElementById('inputYear').value.trim();
  const key = `${t}_${y}`;
  
  const sDateInput = document.getElementById('inputStartDate');
  const eDateInput = document.getElementById('inputEndDate');

  // ดึงข้อมูลให้ก็ต่อเมื่อพิมพ์ปีครบ 4 หลักแล้วเท่านั้น
  if (y.length >= 4) {
     if (systemConfigHistory[key] && systemConfigHistory[key].start && systemConfigHistory[key].end) {
         // ดึงข้อมูลเก่ามาใช้ (ผ่านตัวแปลง)
         const sDate = formatDateForInput(systemConfigHistory[key].start);
         const eDate = formatDateForInput(systemConfigHistory[key].end);
         
         sDateInput.value = sDate;
         eDateInput.value = eDate;
         
         if(sDateInput._flatpickr) sDateInput._flatpickr.setDate(sDate);
         if(eDateInput._flatpickr) eDateInput._flatpickr.setDate(eDate);
         
         if (typeof showToast === 'function') showToast(`ดึงข้อมูลวันที่ของเทอม ${t}/${y} ให้อัตโนมัติ`, 'success');
     } else {
         // ถ้าเป็นเทอมใหม่ที่ไม่มีในประวัติ ให้ล้างช่องรอให้กรอก
         sDateInput.value = "";
         eDateInput.value = "";
         if(sDateInput._flatpickr) sDateInput._flatpickr.clear();
         if(eDateInput._flatpickr) eDateInput._flatpickr.clear();
         
         if (typeof showToast === 'function') showToast(`ยังไม่มีประวัติวันที่ของเทอม ${t}/${y} โปรดระบุใหม่`, 'warning');
     }
  }
}

function _studentStatusBadge(status) {

  if (status === 'จบการศึกษา') return '<span class="badge bg-secondary-subtle text-secondary border border-secondary rounded-pill px-2">🎓 จบการศึกษา</span>';
  return '<span class="badge bg-danger-subtle text-danger border border-danger rounded-pill px-2">แขวนลอย</span>';
}

function renderStudentAccordion(students) {
  var container = document.getElementById('studentAccordion');
  if (!container) return;
  var isSearching = (document.getElementById('searchInput') || {}).value;
  var showGrad = (document.getElementById('showGraduatedToggle') || {}).checked;
  var gradCount = students.filter(function(r) { return String(r[7] || '').trim() === 'จบการศึกษา'; }).length;
  var visible = showGrad ? students : students.filter(function(r) { return String(r[7] || '').trim() !== 'จบการศึกษา'; });
  if (visible.length === 0) {
    var hint = !showGrad && gradCount ? ' (ซ่อนนักเรียนที่จบแล้ว ' + gradCount + ' คน)' : '';
    container.innerHTML = '<div class="pssms-card text-center p-5 text-muted">ไม่พบข้อมูลนักเรียน' + hint + '</div>';
    return;
  }
  var groups = {};
  visible.forEach(function(row) {
    var cls = String(row[4] || '').trim() || 'ไม่ระบุ';
    if (!groups[cls]) groups[cls] = [];
    groups[cls].push(row);
  });
  var sortedClasses = Object.keys(groups).sort(function(a, b) { return a.localeCompare(b, 'th', { numeric: true }); });
  if (_expandedGroups.size === 0 && !isSearching) _expandedGroups.add(sortedClasses[0]);
  var html = '';
  sortedClasses.forEach(function(cls, idx) {
    var rows = groups[cls];
    var male = 0, female = 0, suspended = 0, graduated = 0;
    rows.forEach(function(r) {
      var st = String(r[7] || '').trim();
      if (/^(นาย|ด\.ช\.|ดช\.|เด็กชาย)/.test(String(r[2]))) male++; else female++;
      if (st === 'แขวนลอย') suspended++;
      else if (st === 'จบการศึกษา') graduated++;
    });
    var safeId = 'sg_' + idx;
    var isOpen = isSearching ? true : _expandedGroups.has(cls);
    var subInfo = 'ชาย ' + male + ' | หญิง ' + female;
    if (suspended) subInfo += ' | <span class="text-danger">แขวนลอย ' + suspended + '</span>';
    if (graduated) subInfo += ' | <span style="color:#5b21b6;">🎓 ' + graduated + '</span>';
    html += '<div class="pssms-card mb-2 p-0" style="overflow:hidden;">';
    html += '<div class="student-group-header d-flex align-items-center px-3 py-2 gap-2" data-class="' + escapeAttr(cls) + '" data-body-id="' + safeId + '" style="cursor:pointer;background:var(--p-subtle);border-bottom:1px solid var(--p-border);">';
    html += '<span class="fw-bold" style="font-size:.9rem;">' + escapeHtmlSafe(cls) + '</span>';
    html += '<span class="pssms-chip ms-1">' + rows.length + ' คน</span>';
    html += '<span class="text-muted small ms-1">' + subInfo + '</span>';
    html += '<i class="fas fa-chevron-' + (isOpen ? 'up' : 'down') + ' ms-auto text-muted" style="font-size:.75rem;"></i>';
    html += '</div>';
    html += '<div id="' + safeId + '"' + (isOpen ? '' : ' style="display:none;"') + '>';
    html += '<div class="table-responsive"><table class="pssms-table mb-0 text-nowrap" style="font-size:.85rem;"><thead><tr>';
    html += '<th class="ps-4">รหัสนักเรียน</th><th>ชื่อ-สกุล</th><th class="text-center">สถานะ</th><th class="text-end pe-4">จัดการ</th>';
    html += '</tr></thead><tbody>';
    rows.forEach(function(row) {
      var studentId = String(row[0] || '');
      var studentName = String(row[2] || '');
      var status = String(row[7] || '').trim() || 'ปกติ';
      var trCls = status === 'แขวนลอย' ? ' class="table-danger"' : status === 'จบการศึกษา' ? ' class="text-muted"' : '';
      html += '<tr' + trCls + '><td class="ps-4 fw-bold text-primary">' + escapeHtmlSafe(studentId) + '</td><td>' + escapeHtmlSafe(studentName) + '</td><td class="text-center">' + _studentStatusBadge(status) + '</td><td class="text-end pe-4"><button class="btn btn-sm btn-outline-primary me-1 shadow-none" onclick="openModal(\'edit\',' + jsArgAttr(studentId) + ')"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-outline-danger shadow-none" onclick="confirmDelete(' + jsArgAttr(studentId) + ')"><i class="fas fa-trash"></i></button></td></tr>';
    });
    html += '</tbody></table></div></div></div>';
  });
  container.innerHTML = html;
  container.querySelectorAll('.student-group-header').forEach(function(header) {
    header.addEventListener('click', function() {
      toggleStudentGroup(header.getAttribute('data-class') || '', header.getAttribute('data-body-id') || '');
    });
  });
}

function toggleStudentGroup(cls, safeId) {
  var body = document.getElementById(safeId);
  var header = body ? body.previousElementSibling : null;
  if (!body) return;
  var isOpen = body.style.display !== 'none';
  if (isOpen) {
    body.style.display = 'none';
    _expandedGroups.delete(cls);
  } else {
    body.style.display = '';
    _expandedGroups.add(cls);
  }
  if (header) {
    var icon = header.querySelector('i.fa-chevron-up, i.fa-chevron-down');
    if (icon) { icon.classList.toggle('fa-chevron-up', !isOpen); icon.classList.toggle('fa-chevron-down', isOpen); }
  }
}

function renderStudentSummary(data) {
  const summaryContainer = document.getElementById('studentSummaryContainer');
  const tbody = document.getElementById('summaryTableBody');
  if (!summaryContainer || !tbody) return;
  const students = data.filter(row => row[3] === 'Student');
  if (students.length === 0) { summaryContainer.style.display = 'none'; return; }
  summaryContainer.style.display = 'block';
  let totalActive = 0, totalSuspended = 0, totalGraduated = 0, totalMale = 0, totalFemale = 0;
  const roomStats = {};
  students.forEach(s => {
    const room = String(s[4]).trim() || 'ไม่ระบุ';
    const name = String(s[2]).trim();
    const status = String(s[7]).trim() || 'ปกติ';
    const isMale = /^(นาย|ด\.ช\.|ดช\.|เด็กชาย)/.test(name);
    if (status === 'ปกติ') totalActive++;
    else if (status === 'จบการศึกษา') totalGraduated++;
    else totalSuspended++;
    if (isMale) totalMale++; else totalFemale++;
    if (!roomStats[room]) roomStats[room] = { male: 0, female: 0, active: 0, suspended: 0, graduated: 0, total: 0 };
    if (isMale) roomStats[room].male++; else roomStats[room].female++;
    if (status === 'ปกติ') roomStats[room].active++;
    else if (status === 'จบการศึกษา') roomStats[room].graduated++;
    else roomStats[room].suspended++;
    roomStats[room].total++;
  });
  document.getElementById('sumTotal').innerText = students.length;
  document.getElementById('sumActive').innerText = totalActive;
  document.getElementById('sumSuspended').innerText = totalSuspended;
  const sumGrad = document.getElementById('sumGraduated');
  if (sumGrad) sumGrad.innerText = totalGraduated;
  document.getElementById('sumMale').innerText = totalMale;
  document.getElementById('sumFemale').innerText = totalFemale;
  let html = '';
  const sortedRooms = Object.keys(roomStats).sort((a, b) => a.localeCompare(b, 'th', { numeric: true }));
  sortedRooms.forEach(room => {
    const s = roomStats[room];
    html += `<tr><td class="fw-bold text-start ps-3"><span class="badge bg-light text-dark border border-secondary-subtle shadow-sm">${escapeHtmlSafe(room)}</span></td><td>${s.male||'-'}</td><td>${s.female||'-'}</td><td class="text-success fw-bold">${s.active||'-'}</td><td class="text-danger">${s.suspended||'-'}</td><td style="color:#5b21b6;">${s.graduated||'-'}</td><td class="fw-bold text-primary bg-light">${s.total}</td></tr>`;
  });
  html += `<tr class="table-light fw-bold text-dark"><td class="text-end pe-3">รวมทั้งหมด</td><td>${totalMale}</td><td>${totalFemale}</td><td class="text-success">${totalActive}</td><td class="text-danger">${totalSuspended}</td><td style="color:#5b21b6;">${totalGraduated}</td><td class="text-primary fs-6">${students.length}</td></tr>`;
  tbody.innerHTML = html;
}

// 📥 อ่านไฟล์นำเข้า — spec คอลัมน์มาจาก lib/importSpec.js ผ่าน getImportSpec
// ห้ามเขียนรายชื่อคอลัมน์ซ้ำที่นี่ ไฟล์ src/*.html ไม่มี module system
// ก๊อปมาเมื่อไหร่ก็ drift ออกจากตัวตรวจฝั่ง server แบบเงียบ ๆ
// ==========================================
var _importSpec = null;

function _loadImportSpec() {
  return new Promise(function(resolve, reject) {
    if (_importSpec) return resolve(_importSpec);
    google.script.run
      .withSuccessHandler(function(s) { _importSpec = s; resolve(s); })
      .withFailureHandler(reject)
      .getImportSpec();
  });
}

// SheetJS โหลดเฉพาะตอนจะใช้ — ~900KB ไม่ควรถ่วงทุกหน้าเพื่อฟีเจอร์ที่ใช้ปีละครั้ง
// pin เวอร์ชันไว้ (CDN อื่นในโปรเจกต์บางตัวยังไม่ pin — อย่าทำตาม)
var _XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var _xlsxLoading = null;

function _loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = _XLSX_URL;
    s.onload = function() { resolve(window.XLSX); };
    s.onerror = function() { _xlsxLoading = null; reject(new Error('โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ — ตรวจอินเทอร์เน็ต')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}

/**
 * ถอดไบต์ CSV เป็นข้อความ — Excel ภาษาไทยบันทึก CSV เป็น windows-874 (TIS-620)
 * ไม่ใช่ UTF-8 อ่านด้วย UTF-8 ตรง ๆ จะได้ภาษาต่างดาวทั้งไฟล์
 * ลอง UTF-8 แบบเข้มก่อน (fatal:true) ล้มเมื่อไหร่แปลว่าไม่ใช่ UTF-8 ค่อยตกไป 874
 */
function _decodeCsv(buf) {
  var bytes = new Uint8Array(buf);
  if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return new TextDecoder('utf-8').decode(bytes.subarray(3));
  }
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch (e) {
    return new TextDecoder('windows-874').decode(bytes);
  }
}

// แยกบรรทัด CSV โดยเคารพ quote (ชื่อโรงเรียน/ชื่อวิชามี comma ได้)
function _csvCells(line) {
  var out = [], cur = '', q = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') {
      if (q && line[i + 1] === '"') { cur += '"'; i++; }
      else q = !q;
    } else if (ch === ',' && !q) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(function(c) { return c.trim(); });
}

// หัวตารางที่โรงเรียนกรอก → key ที่ backend ใช้ (ไทยเป็นหลัก รับ alias อังกฤษด้วย)
function _headerKey(cols, header) {
  var h = String(header || '').trim().toLowerCase().replace(/\s+/g, '');
  for (var i = 0; i < cols.length; i++) {
    var c = cols[i];
    if (String(c.label).trim().toLowerCase().replace(/\s+/g, '') === h) return c.key;
    for (var j = 0; j < (c.aliases || []).length; j++) {
      if (String(c.aliases[j]).toLowerCase() === h) return c.key;
    }
  }
  return '';
}

// ตาราง 2 มิติ (แถวแรก = หัวตาราง) → { rows, unknownHeaders, missingRequired }
// `raw` บอกว่า cell ไหนเข้ามาเป็น "ตัวเลข" จาก Excel — ใช้จับ 0 นำหน้าที่โดนกิน
function _gridToRows(grid, kind) {
  var spec = _importSpec.specs[kind];
  if (!grid.length) return { rows: [], unknownHeaders: [], missingRequired: [] };

  var headers = grid[0].map(function(h) { return String(h == null ? '' : h).trim(); });
  var keys = headers.map(function(h) { return _headerKey(spec.columns, h); });
  var unknownHeaders = headers.filter(function(h, i) { return h && !keys[i]; });

  var have = {};
  keys.forEach(function(k) { if (k) have[k] = true; });
  var missingRequired = spec.columns
    .filter(function(c) { return c.required && !have[c.key]; })
    .map(function(c) { return c.label; });

  var rows = [];
  for (var i = 1; i < grid.length; i++) {
    var cells = grid[i] || [];
    var any = false;
    for (var j = 0; j < cells.length; j++) {
      if (cells[j] !== undefined && cells[j] !== null && String(cells[j]).trim() !== '') { any = true; break; }
    }
    if (!any) continue;
    var row = {}, numeric = {};
    keys.forEach(function(k, idx) {
      if (!k) return;
      var v = cells[idx];
      if (typeof v === 'number') numeric[k] = true;
      row[k] = v === undefined || v === null ? '' : String(v).trim();
    });
    row.__excelRow = i + 1;
    row.__numeric = numeric;
    rows.push(row);
  }
  return { rows: rows, unknownHeaders: unknownHeaders, missingRequired: missingRequired };
}

/** อ่านไฟล์ที่ผู้ใช้เลือก → grid แล้วส่งต่อให้ _gridToRows */
function _readImportFile(file, kind) {
  var isXlsx = /\.xlsx?$/i.test(file.name);
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function() { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
    reader.onload = function(e) {
      try {
        if (!isXlsx) {
          var text = _decodeCsv(e.target.result);
          var grid = text.split(/\r?\n/).map(_csvCells);
          return resolve(_gridToRows(grid, kind));
        }
        _loadXLSX().then(function(XLSX) {
          var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          var ws = wb.Sheets[wb.SheetNames[0]];
          // raw:true = เก็บชนิด number ไว้ เพื่อรู้ว่า Excel กิน 0 นำหน้าไปหรือยัง
          var grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
          resolve(_gridToRows(grid, kind));
        }).catch(reject);
      } catch (err) { reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}

/**
 * ตรวจแถวด้วยกติกาที่มาจาก spec (required/pattern/oneOf/unique/normalize)
 * เป็นกติกาชุดเดียวกับ `prepareRows()` ฝั่ง server — server ยังเป็นคนบังคับจริงเสมอ
 * ที่นี่มีไว้ให้คนเห็นปัญหาก่อนกด ไม่ใช่แทนการตรวจฝั่ง server
 */
function _validateImportRows(rows, kind) {
  var spec = _importSpec.specs[kind];
  var errors = [], warnings = [], seen = {};

  // ความยาวมากสุดของคอลัมน์รหัส ใช้เดาว่าแถวไหนน่าจะโดนตัด 0 นำหน้า
  var maxLen = {};
  spec.columns.forEach(function(c) {
    if (!c.keepLeadingZero) return;
    maxLen[c.key] = rows.reduce(function(m, r) { return Math.max(m, String(r[c.key] || '').length); }, 0);
  });

  rows.forEach(function(r) {
    var at = r.__excelRow;
    spec.columns.forEach(function(c) {
      var v = String(r[c.key] || '').trim();

      if (c.required && !v) { errors.push({ row: at, message: 'ไม่ได้กรอก "' + c.label + '"' }); return; }
      if (!v) return;

      if (c.normalize === 'day') {
        var d = _normalizeDayClient(v);
        if (!d) { errors.push({ row: at, message: c.label + ' "' + v + '" อ่านไม่ออก — ใช้ชื่อวันไทยเต็ม เช่น จันทร์' }); return; }
        r[c.key] = v = d;
      }
      if (c.pattern && !new RegExp(c.pattern).test(v)) {
        errors.push({ row: at, message: c.label + ' "' + v + '" รูปแบบไม่ถูกต้อง' }); return;
      }
      if (c.oneOf && c.oneOf.indexOf(v) === -1) {
        errors.push({ row: at, message: c.label + ' "' + v + '" ต้องเป็นหนึ่งใน: ' + c.oneOf.join(', ') }); return;
      }
      if (c.unique) {
        if (seen[c.key + '|' + v]) errors.push({ row: at, message: c.label + ' "' + v + '" ซ้ำกับแถว ' + seen[c.key + '|' + v] });
        else seen[c.key + '|' + v] = at;
      }
      if (c.keepLeadingZero) {
        // Excel แปลง '01903' เป็นเลข 1903 ให้เอง — ระบบไม่เดาแทน แค่ชี้ให้คนตัดสิน
        if (r.__numeric && r.__numeric[c.key]) {
          warnings.push({ row: at, message: c.label + ' "' + v + '" ถูกอ่านเป็นตัวเลข — 0 นำหน้าอาจหายไปแล้ว' });
        } else if (/^\d+$/.test(v) && v.length < maxLen[c.key] && v[0] !== '0') {
          warnings.push({ row: at, message: c.label + ' "' + v + '" สั้นกว่ารหัสอื่นในไฟล์ — อาจถูกตัด 0 นำหน้า' });
        }
      }
    });
  });
  return { errors: errors, warnings: warnings };
}

function _normalizeDayClient(v) {
  var raw = String(v || '').trim().replace(/^วัน/, '').replace(/\.+$/, '').trim();
  if (!raw) return '';
  if (_importSpec.dayNames.indexOf(raw) !== -1) return raw;
  return _importSpec.dayAliases[raw] || '';
}

// สีคงที่จาก token ไม่ส่งสีเป็นสตริงเข้ามา — เพิ่ม/แก้สีทำที่ CSS ที่เดียว
function _impChip(text, kind) {
  return '<span class="imp-chip imp-chip-' + kind + '">' + text + '</span>';
}

/**
 * เปิดหน้าตรวจ — cfg: { kind, title, rows, unknownHeaders, errors, warnings,
 *                       confirmText, noteHtml, onConfirm }
 * มีข้อผิดพลาด = ปุ่มยืนยันถูกปิด ต้องกลับไปแก้ไฟล์ (ADR 0003 · ไฟล์ผิดไม่เขียนบางส่วน)
 */
function _impOpen(cfg) {
  _impEnsureModal();
  var spec = _importSpec.specs[cfg.kind];
  var byRow = {};
  function mark(list, level) {
    list.forEach(function(e) {
      if (!byRow[e.row]) byRow[e.row] = { level: '', msgs: [] };
      if (level === 'error') byRow[e.row].level = 'error';
      else if (!byRow[e.row].level) byRow[e.row].level = 'warn';
      byRow[e.row].msgs.push(e.message);
    });
  }
  mark(cfg.errors, 'error');
  mark(cfg.warnings, 'warn');

  var badRows = Object.keys(byRow).filter(function(k) { return byRow[k].level === 'error'; }).length;
  document.getElementById('impTitle').textContent = 'ตรวจข้อมูลก่อนนำเข้า — ' + cfg.title;
  document.getElementById('impSummary').innerHTML =
    _impChip('นำเข้าได้ ' + (cfg.rows.length - badRows), 'ok') +
    _impChip('เตือน ' + cfg.warnings.length, cfg.warnings.length ? 'warn' : 'none') +
    _impChip('ผิด ' + cfg.errors.length, cfg.errors.length ? 'error' : 'none');

  var notes = '';
  if (cfg.errors.length) {
    notes += '<div class="imp-note imp-note-error">' +
      '<b>แก้ไฟล์แล้วอัปใหม่</b> — ไฟล์ที่มีข้อผิดพลาดจะไม่ถูกนำเข้าบางส่วน ระบบเขียนทั้งไฟล์หรือไม่เขียนเลย</div>';
  }
  if (cfg.warnings.length) {
    notes += '<div class="imp-note imp-note-warn">' +
      'แถวที่ขึ้นสีเหลืองนำเข้าได้ แต่ควรดูก่อนว่าถูกจริง</div>';
  }
  if (cfg.unknownHeaders.length) {
    notes += '<div class="imp-note">คอลัมน์ที่ระบบไม่รู้จัก (จะถูกข้าม): ' +
      cfg.unknownHeaders.map(_escH).join(', ') + '</div>';
  }
  if (cfg.noteHtml) notes += '<div class="imp-note imp-note-info">' + cfg.noteHtml + '</div>';
  document.getElementById('impNotes').innerHTML = notes;

  document.getElementById('impHead').innerHTML = '<tr><th style="width:56px;">แถว</th>' +
    spec.columns.map(function(c) { return '<th>' + _escH(c.label) + '</th>'; }).join('') +
    '<th>หมายเหตุ</th></tr>';

  document.getElementById('impBody').innerHTML = cfg.rows.map(function(r) {
    var info = byRow[r.__excelRow];
    var cls = info ? (info.level === 'error' ? 'imp-row-error' : 'imp-row-warn') : '';
    return '<tr class="' + cls + '"><td class="text-muted small">' + r.__excelRow + '</td>' +
      spec.columns.map(function(c) { return '<td>' + _escH(r[c.key] || '') + '</td>'; }).join('') +
      '<td class="imp-why">' + (info ? _escH(info.msgs.join(' · ')) : '') + '</td></tr>';
  }).join('');

  var btn = document.getElementById('impConfirm');
  btn.textContent = cfg.errors.length ? 'แก้ไฟล์ก่อน' : cfg.confirmText;
  btn.disabled = cfg.errors.length > 0;
  btn.onclick = function() {
    _impModal.hide();
    cfg.onConfirm();
  };

  _impModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('importPreviewModal'));
  _impModal.show();
}

function handleFileUpload(input, type) {
  var file = input.files[0];
  if (!file) return;
  var kind = type === 'student' ? 'student' : 'teacher';
  var reset = function() { input.value = ''; };

  _loadImportSpec()
    .then(function() { return _readImportFile(file, kind); })
    .then(function(parsed) {
      if (parsed.missingRequired.length) {
        reset();
        return showAlert('❌ ไฟล์ขาดคอลัมน์ที่ต้องมี: ' + parsed.missingRequired.join(', '));
      }
      if (!parsed.rows.length) { reset(); return showAlert('⚠️ ไม่พบแถวข้อมูลใต้หัวตาราง'); }

      var v = _validateImportRows(parsed.rows, kind);
      _impOpen({
        kind: kind,
        title: _importSpec.specs[kind].title,
        rows: parsed.rows,
        unknownHeaders: parsed.unknownHeaders,
        errors: v.errors,
        warnings: v.warnings,
        noteHtml: 'คนที่มีอยู่แล้วจะถูกทับด้วยข้อมูลใหม่ · <b>ไม่มีใครถูกลบ</b> — ลบคนต้องทำในหน้านี้ทีละคน',
        confirmText: 'นำเข้า ' + parsed.rows.length + ' รายการ',
        onConfirm: function() {
          document.getElementById('uploadStatus').classList.remove('d-none');
          var func = type === 'student' ? 'importStudentCSV' : 'importTeacherCSV';
          google.script.run
            .withSuccessHandler(function(res) {
              document.getElementById('uploadStatus').classList.add('d-none');
              showAlert(res.message); reset(); loadUserData(true);
            })
            .withFailureHandler(function(err) {
              document.getElementById('uploadStatus').classList.add('d-none');
              showAlert('❌ ' + err.message); reset();
            })[func](parsed.rows);
        },
      });
    })
    .catch(function(err) { reset(); showAlert('❌ ' + err.message); });
}

/** สร้างไฟล์แม่แบบสดจาก spec — หัวตารางจึงตรงกับตัวตรวจเสมอ ไม่มีทาง drift */
function downloadImportTemplate(kind) {
  _loadImportSpec()
    .then(function() { return _loadXLSX(); })
    .then(function(XLSX) {
      var spec = _importSpec.specs[kind];
      var cols = spec.columns;
      var aoa = [
        cols.map(function(c) { return c.label; }),
        cols.map(function(c) { return c.example === undefined ? '' : c.example; }),
      ];
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      // คอลัมน์รหัสต้องเป็น Text ตั้งแต่ในแม่แบบ ไม่งั้น Excel กิน 0 นำหน้าตอนครูพิมพ์
      cols.forEach(function(c, i) {
        if (!c.keepLeadingZero) return;
        for (var r = 0; r < aoa.length; r++) {
          var ref = XLSX.utils.encode_cell({ c: i, r: r });
          if (ws[ref]) { ws[ref].t = 's'; ws[ref].z = '@'; }
        }
      });
      ws['!cols'] = cols.map(function(c) { return { wch: Math.max(12, c.label.length + 4) }; });
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, spec.title);
      XLSX.writeFile(wb, 'แม่แบบนำเข้า-' + spec.title + '.xlsx');
      if (typeof showToast === 'function') showToast('ดาวน์โหลดแม่แบบ' + spec.title + 'แล้ว', 'success');
    })
    .catch(function(err) { showAlert('❌ สร้างแม่แบบไม่สำเร็จ: ' + err.message); });
}

// ==========================================
var currentTimetableData = [];
var editModalInstance = null;

var _TTO_SHARED_KWORDS = ['แนะแนว','วิถีพุทธ','ผู้บำเพ็ญ','ลูกเสือ','เนตรนารี','กิจกรรมพัฒนา','ยุวกาชาด','โฮมรูม','ชุมนุม'];
var _TTO_SHARED_CODE_PREFIXES = ['HR','CLUB_','ลส','นน'];
var _ttoCurrentConflicts = { self: new Set(), cls: new Set() };

function _ttoIsShared(d) {
  var code = String(d[0]).trim();
  if (_TTO_SHARED_CODE_PREFIXES.some(function(p){ return code.toUpperCase().startsWith(p.toUpperCase()); })) return true;
  if (String(d[7]).trim() === '0') return true;
  var n = String(d[1]).trim();
  return _TTO_SHARED_KWORDS.some(function(k){ return n.includes(k); });
}

function _ttoComputeConflicts() {
  var selfMap = {}, classMap = {};
  currentTimetableData.forEach(function(item) {
    if (_ttoIsShared(item.data)) return;
    var key = String(item.data[6]) + '|' + String(item.data[7]);
    if (!selfMap[key]) selfMap[key] = [];
    selfMap[key].push(item.rowIndex);
  });
  _ttoAllRows.forEach(function(item) {
    if (_ttoIsShared(item.data)) return;
    var key = String(item.data[2]).trim() + '|' + String(item.data[3]).trim() + '|' + String(item.data[6]).trim() + '|' + String(item.data[7]).trim();
    if (!classMap[key]) classMap[key] = [];
    classMap[key].push(item.rowIndex);
  });
  var self = new Set(), cls = new Set();
  var curIdxSet = new Set(currentTimetableData.map(function(i){ return i.rowIndex; }));
  Object.values(selfMap).forEach(function(idxs) {
    if (idxs.length > 1) idxs.forEach(function(i){ self.add(i); });
  });
  Object.values(classMap).forEach(function(idxs) {
    if (idxs.length > 1) idxs.forEach(function(i){ if (curIdxSet.has(i)) cls.add(i); });
  });
  _ttoCurrentConflicts = { self: self, cls: cls };
}

// ==========================================
// 📥 ระบบนำเข้าตารางสอนผ่าน CSV (แก้บัค SweetAlert2 ใช้งานได้ 100%)
// ==========================================
// นำเข้าตารางสอน = **ล้างทั้งเทอมแล้วใส่ใหม่** ไม่ใช่ต่อท้าย (ADR 0003)
// เดิมมีปุ่ม "นำเข้าต่อท้ายข้อมูลเดิม" ซึ่งเป็นทางเดียวที่ทำให้เกิดแถวซ้ำจนต้องมี
// เครื่องมือกำจัดแยก — และ flag นั้นก็ไม่เคยถึง backend อยู่ดี
function handleTimetableUpload(inputElement) {
  var file = inputElement.files[0];
  if (!file) return;
  var reset = function() { inputElement.value = ''; };

  _loadImportSpec()
    .then(function() { return _readImportFile(file, 'timetable'); })
    .then(function(parsed) {
      if (parsed.missingRequired.length) {
        reset();
        return showAlert('❌ ไฟล์ขาดคอลัมน์ที่ต้องมี: ' + parsed.missingRequired.join(', '));
      }
      if (!parsed.rows.length) { reset(); return showAlert('⚠️ ไม่พบแถวข้อมูลใต้หัวตาราง'); }

      // ต้องบอกจำนวนจริงทั้งสองข้าง คนถึงจะเห็นสิ่งที่กำลังจะหายไปก่อนกด (ADR 0003)
      // ⚠️ ห้ามนับจาก _ttoAllRows — มีค่าเฉพาะตอนแท็บภาพรวมโหลดแล้ว เปิดหน้ามากด
      // นำเข้าเลยจะขึ้น "ลบ 0 แถว" ทั้งที่กำลังจะลบทั้งเทอม ถามจำนวนจริงเสมอ
      var term = window._hrActiveTerm || (getSessionUser() || {}).currentTerm || '';
      var year = window._hrActiveYear || (getSessionUser() || {}).currentYear || '';
      return new Promise(function(resolve) {
        google.script.run
          .withSuccessHandler(function(rows) { resolve(Array.isArray(rows) ? rows.length : null); })
          .withFailureHandler(function() { resolve(null); })
          .getFilteredTimetables('', term, year);
      }).then(function(existing) { return { parsed: parsed, term: term, year: year, existing: existing }; });
    })
    .then(function(ctx) {
      if (!ctx) return;   // ตกมาจากทางที่ showAlert ไปแล้ว
      var parsed = ctx.parsed;
      var losing = ctx.existing === null
        ? '<b>ตารางสอนเดิมของเทอมนี้จะถูกลบทั้งหมด</b>'
        : '<b>จะลบตารางสอนเทอม ' + ctx.term + '/' + ctx.year + ' ที่มีอยู่ ' + ctx.existing + ' แถว</b>';

      var v = _validateImportRows(parsed.rows, 'timetable');
      _impOpen({
        kind: 'timetable',
        title: 'ตารางสอน',
        rows: parsed.rows,
        unknownHeaders: parsed.unknownHeaders,
        errors: v.errors,
        warnings: v.warnings,
        noteHtml: losing + ' แล้วใส่ใหม่ ' + parsed.rows.length + ' แถวจากไฟล์',
        confirmText: 'ลบของเดิมแล้วนำเข้า ' + parsed.rows.length + ' แถว',
        onConfirm: function() {
          var labelBtn = inputElement.parentElement;
          var originalHTML = labelBtn.innerHTML;
          labelBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> กำลังประมวลผล...';
          labelBtn.style.pointerEvents = 'none';
          var restore = function() {
            labelBtn.innerHTML = originalHTML;
            labelBtn.style.pointerEvents = 'auto';
            reset();
          };
          google.script.run
            .withSuccessHandler(function(res) {
              restore();
              showAlert(res.message);
              if (typeof viewTimetable === 'function') viewTimetable();
            })
            .withFailureHandler(function(err) { restore(); showAlert('❌ ' + err.message); })
            .importTimetableCSV(parsed.rows);
        },
      });
    })
    .catch(function(err) { reset(); showAlert('❌ ' + err.message); });
}

function initAdminTimetable() {
  if (!document.getElementById('ttOverviewPage')) return;
  var user = getSessionUser();
  var termEl = document.getElementById('ttoTerm');
  var yearEl = document.getElementById('ttoYear');
  if (termEl && !termEl.value) termEl.value = user.currentTerm || '1';
  if (yearEl && !yearEl.value) yearEl.value = user.currentYear || '';
  var subtitle = document.getElementById('ttoSubtitle');
  if (subtitle) subtitle.textContent = 'เทอม ' + (termEl ? termEl.value : '') + '/' + (yearEl ? yearEl.value : '');

  if (window._ttoAutoTab) {
    var _at = window._ttoAutoTab;
    window._ttoAutoTab = null;
    var _atBtn = document.getElementById('ttoTab' + _at.charAt(0).toUpperCase() + _at.slice(1) + 'Btn');

// ==========================================
// 🎨 วาดตารางสอนแบบ Grid (แก้ไขช่องพักเที่ยง & พัก 10 นาทีแบบสมบูรณ์)
// ==========================================
// ==========================================
// 🎨 วาดตารางสอนแบบ Grid (แก้ไขช่องพักเที่ยง & พัก 10 นาที แบบไม่ให้เบี้ยว 100%)
// ==========================================
function renderTimetableGrid() {
  const days = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์'];
  const tbody = document.getElementById('timetableGridBody');
  let html = '';
  
  days.forEach(day => {
    html += `<tr><td class="bg-light fw-bold" style="vertical-align: middle;">${day}</td>`;
    
    for(let p = 1; p <= 8; p++) {
      
      // 🌟 วาดช่องพัก 10 นาที ลงในทุกๆ บรรทัด (ป้องกันตารางเบี้ยว)
      if (p === 3) {
         html += `<td class="bg-warning-subtle align-middle text-muted fw-bold" style="width: 50px; font-size: 11px;">พัก</td>`;
      }
      
      // 🌟 วาดช่องพักกลางวัน ลงในทุกๆ บรรทัด (ป้องกันตารางเบี้ยว)
      if (p === 5) {
         html += `<td class="bg-warning-subtle align-middle text-dark fw-bold" style="width: 60px; font-size: 12px;">พักกลางวัน</td>`;
      }
      
      // ค้นหาข้อมูลคาบเรียน
      const match = currentTimetableData.find(item => item.data[6] === day && parseInt(item.data[7]) === p);
      
      if(match) {
        const r = match.data;
        const isClub = String(r[0]).indexOf('CLUB_') === 0;
        var isSelf = _ttoCurrentConflicts.self.has(match.rowIndex);
        var isCls = _ttoCurrentConflicts.cls.has(match.rowIndex);
        var bgColor = isSelf ? '#fde8e8' : (isCls ? '#fef9c3' : '#e7f1ff');
        var borderStyle = isSelf ? 'border: 2px solid #f87171;' : (isCls ? 'border: 2px solid #fbbf24;' : 'border: 1px solid #dee2e6;');
        var conflictLabel = isSelf ? '<div style="font-size:10px;color:#dc2626;font-weight:600;">⚠️ ชนกัน</div>'
          : (isCls ? '<div style="font-size:10px;color:#d97706;font-weight:600;">⚠️ ห้องซ้อน</div>' : '');
        html += `<td class="p-2" onclick="openEditTimetable(${match.rowIndex})" style="cursor:pointer; background-color: ${bgColor}; min-width: 110px; ${borderStyle} transition: 0.2s;" title="คลิกเพื่อแก้ไข">
                    ${conflictLabel}
                    ${isClub ? '<div class="text-primary fw-bold" style="font-size: 13px;">ชุมนุม</div>' : `<div class="text-primary fw-bold" style="font-size: 13px;">${r[0]}</div>`}
                    <div class="text-dark truncate-text my-1" style="font-size: 12px; line-height: 1.2;">${r[1]}</div>
                    <span class="badge bg-secondary shadow-sm" style="font-size: 11px;">${r[2]}/${r[3]} (${r[4]})</span>
                 </td>`;
      } else { 
        html += `<td class="text-muted align-middle" style="background-color: #fafafa; border: 1px solid #dee2e6;">-</td>`; 
      }
    }
    html += `</tr>`;
  });
  tbody.innerHTML = html;
}

// ==========================================
// 🎨 วาดตารางสอนแบบรายการ (List) จัดคอลัมน์ให้ตรงเป๊ะ
// ==========================================
function renderTimetableList() {
  const tbody = document.getElementById('timetableDisplayBody');
  var conflicts = _ttoCurrentConflicts;
  var allConflictIdxs = new Set([].concat(Array.from(conflicts.self), Array.from(conflicts.cls)));

  var summaryEl = document.getElementById('ttoConflictSummary');
  if (summaryEl) {
    if (allConflictIdxs.size > 0) {
      var parts = [];
      if (conflicts.self.size > 0) parts.push(conflicts.self.size + ' คาบครูสอนซ้อนกัน');
      if (conflicts.cls.size > 0) parts.push(conflicts.cls.size + ' คาบห้องเรียนซ้อนกัน');
      summaryEl.className = 'alert alert-warning py-2 px-3 mb-2 small';
      summaryEl.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i>พบ <strong>' + allConflictIdxs.size + '</strong> คาบที่มีปัญหา — ' + parts.join(', ');
    } else {
      summaryEl.className = 'd-none';
      summaryEl.innerHTML = '';
    }
  }

  let html = '';
  if(currentTimetableData.length === 0) {
    html = '<tr><td colspan="8" class="text-center p-5 text-muted">ไม่มีข้อมูลตารางสอน</td></tr>';
  } else {
    const dayOrder = {'จันทร์':1, 'อังคาร':2, 'พุธ':3, 'พฤหัสบดี':4, 'ศุกร์':5};
    currentTimetableData.sort((a,b) => {
      if(dayOrder[a.data[6]] !== dayOrder[b.data[6]]) return dayOrder[a.data[6]] - dayOrder[b.data[6]];
      return a.data[7] - b.data[7];
    });

    currentTimetableData.forEach(item => {
      const r = item.data;
      const isClub = String(r[0]).indexOf('CLUB_') === 0;
      var isSelf = conflicts.self.has(item.rowIndex);
      var isCls = conflicts.cls.has(item.rowIndex);
      var rowStyle = (isSelf || isCls) ? ' style="background:#fff5f5;"' : '';
      var badge = isSelf
        ? '<span class="badge bg-danger ms-1" title="ครูสอน 2 วิชาพร้อมกัน" style="font-size:.68rem;">⚠️ชนกัน</span>'
        : (isCls ? '<span class="badge bg-warning text-dark ms-1" title="ห้องนี้มีครูสอนซ้อนกัน" style="font-size:.68rem;">⚠️ห้องซ้อน</span>' : '');
      html += `<tr${rowStyle}>
        <td class="ps-4"><span class="badge bg-light text-dark border shadow-sm">${r[6]}</span></td>
        <td class="text-center fw-bold">คาบ ${r[7]} ${badge}</td>
        <td class="fw-bold text-primary">${isClub ? 'ชุมนุม' : r[0]}</td>
        <td>${r[1]}</td>
        <td>${r[2]}</td>
        <td>${r[3]}</td>
        <td>${r[4]}</td>
        <td class="text-end pe-4"><button class="btn btn-sm btn-outline-primary" onclick="openEditTimetable(${item.rowIndex})"><i class="fas fa-edit"></i></button></td>
      </tr>`;
    });
  }
  tbody.innerHTML = html;
}

function openEditTimetable(rowIndex) {
  const item = currentTimetableData.find(i => i.rowIndex === rowIndex);
  if(!item) return;
  document.getElementById('editRowIndex').value = rowIndex;
  document.getElementById('editSubjectCode').value = item.data[0];
  document.getElementById('editSubjectName').value = item.data[1];
  if(document.getElementById('editLevel')) document.getElementById('editLevel').value = item.data[2];
  if(document.getElementById('editRoom')) document.getElementById('editRoom').value = item.data[3];
  if(document.getElementById('editLocation')) document.getElementById('editLocation').value = item.data[4];
  document.getElementById('editDay').value = item.data[6];
  document.getElementById('editPeriod').value = item.data[7];
  const modalEl = document.getElementById('editTimetableModal');
  if(modalEl) {
    if (!editModalInstance) editModalInstance = new bootstrap.Modal(modalEl);
    editModalInstance.show();
  } else { showAlert("ไม่พบ HTML ของ Modal"); }
}

  data.forEach(item => {
    const row = document.getElementById(`crow-${item.id}`);
    if (!row) return;
    row.querySelectorAll('.cur-edit[data-field]').forEach(el => {
      if (el.tagName === 'SELECT') el.value = item[el.dataset.field] || '';
    });
  });
}

function startEditCurriculum(id) {
  if (curriculumEditingId !== null) cancelEditCurriculum(curriculumEditingId);
  curriculumEditingId = id;
  const row = document.getElementById(`crow-${id}`);
  row.querySelectorAll('.cur-view').forEach(el => el.classList.add('d-none'));
  row.querySelectorAll('.cur-edit').forEach(el => el.classList.remove('d-none'));
}

function cancelEditCurriculum(id) {
  curriculumEditingId = null;
  const row = document.getElementById(`crow-${id}`);
  if (!row) return;
  row.querySelectorAll('.cur-view').forEach(el => el.classList.remove('d-none'));
  row.querySelectorAll('.cur-edit').forEach(el => el.classList.add('d-none'));
  // restore original values
  const item = allCurriculumData.find(d => d.id === id);
  if (!item) return;
  row.querySelectorAll('.cur-edit[data-field]').forEach(el => {
    el.tagName === 'SELECT' ? (el.value = item[el.dataset.field] || '') : (el.value = item[el.dataset.field] || '');
  });
}

function saveCurriculumRow(id) {
  const row = document.getElementById(`crow-${id}`);
  const newItem = {};
  row.querySelectorAll('.cur-edit[data-field]').forEach(el => { newItem[el.dataset.field] = el.value.trim(); });
  google.script.run
    .withFailureHandler(err => showToast('❌ ' + err.message, 'danger'))
    .withSuccessHandler(res => {
      if (res.status !== 'success') return showToast('❌ ' + res.message, 'danger');
      curriculumEditingId = null;
      const idx = allCurriculumData.findIndex(d => d.id === id);
      if (idx !== -1) allCurriculumData[idx] = { ...allCurriculumData[idx], ...newItem };
      renderManageTable(filterManageKeyword(document.getElementById('searchManage')?.value));
      renderCurriculumTable(allCurriculumData);
      showToast(res.message, 'success');
    }).updateCurriculumItem(id, newItem);
}

function deleteCurriculumRow(id) {
  Swal.fire({ title: 'ลบตัวชี้วัดนี้?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#dc3545' }).then(r => {
    if (!r.isConfirmed) return;
    google.script.run
      .withFailureHandler(err => showToast('❌ ' + err.message, 'danger'))
      .withSuccessHandler(res => {
        if (res.status !== 'success') return showToast('❌ ' + res.message, 'danger');
        allCurriculumData = allCurriculumData.filter(d => d.id !== id);
        renderManageTable(filterManageKeyword(document.getElementById('searchManage')?.value));
        renderCurriculumTable(allCurriculumData);
        const badge = document.getElementById('curriculumCountBadge');
        if (badge) badge.innerText = `${allCurriculumData.length} รายการ`;
        showToast(res.message, 'success');
      }).deleteCurriculumItem(id);
  });
}

function submitAddCurriculumItem() {
  const item = {
    subjectCode: document.getElementById('newSubjectCode').value.trim(),
    subjectType: document.getElementById('newSubjectType').value,
    standardCode: document.getElementById('newStandardCode').value.trim(),
    description: document.getElementById('newDescription').value.trim(),
    evalType: document.getElementById('newEvalType').value,
  };
  if (!item.standardCode) return showToast('⚠️ กรุณาระบุรหัสตัวชี้วัด', 'warning');
  google.script.run
    .withFailureHandler(err => showToast('❌ ' + err.message, 'danger'))
    .withSuccessHandler(res => {
      if (res.status !== 'success') return showToast('❌ ' + res.message, 'warning');
      item.id = res.id;
      allCurriculumData.push(item);
      renderManageTable(allCurriculumData);
      renderCurriculumTable(allCurriculumData);
      const badge = document.getElementById('curriculumCountBadge');
      if (badge) badge.innerText = `${allCurriculumData.length} รายการ`;
      ['newSubjectCode','newStandardCode','newDescription'].forEach(id => { document.getElementById(id).value = ''; });
      showToast(res.message, 'success');
    }).addCurriculumItem(item);
}

function filterManageKeyword(keyword) {
  if (!keyword) return allCurriculumData;
  const kw = keyword.toLowerCase();
  return allCurriculumData.filter(item =>
    String(item.subjectCode).toLowerCase().includes(kw) ||
    String(item.standardCode).toLowerCase().includes(kw) ||
    String(item.description).toLowerCase().includes(kw)
  );
}

function _filterCurriculumTableImpl() {
  const keyword = document.getElementById('searchCurriculum').value.toLowerCase();
  renderCurriculumTable(filterManageKeyword(keyword));
}
window.filterCurriculumTable = (typeof debounce === 'function') ? debounce(_filterCurriculumTableImpl, 180) : _filterCurriculumTableImpl;

function filterManageTable() {
  renderManageTable(filterManageKeyword(document.getElementById('searchManage')?.value));
}

function uploadCurriculumCSV() {
  const fileInput = document.getElementById('csvCurriculumFile');
  if (!fileInput || !fileInput.files.length) return showToast('⚠️ กรุณาเลือกไฟล์ CSV ก่อนครับ', 'warning');
  const clearOld = document.getElementById('clearOldCurriculum').checked;
  const file = fileInput.files[0];
  const btn = document.getElementById('btnImportCurriculum');
  const oldText = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>กำลังประมวลผล...';
  btn.disabled = true;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const rows = lines.map(line => {
      const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
      return { subjectCode: cols[0]||'', subjectType: cols[1]||'', standardCode: cols[2]||'', description: cols[3]||'', evalType: cols[4]||'' };
    }).filter(r => r.standardCode);
    if (!rows.length) { btn.innerHTML = oldText; btn.disabled = false; return showToast('⚠️ ไม่พบข้อมูลในไฟล์ CSV', 'warning'); }
    google.script.run
      .withFailureHandler(err => { btn.innerHTML = oldText; btn.disabled = false; showToast('❌ Error: ' + err.message, 'danger'); })
      .withSuccessHandler(res => {
        btn.innerHTML = oldText; btn.disabled = false;
        if(res.status === 'success') { showToast(res.message, 'success'); fileInput.value = ''; loadCurriculumData(); }
        else showToast(res.message, 'danger');
      }).importCurriculumCSV(rows, clearOld);
  };
  reader.readAsText(file, 'UTF-8');
}

function initCurriculumDB() {
  Swal.fire({ title: 'สร้างฐานข้อมูล Curriculum?', icon: 'question', showCancelButton: true, confirmButtonText: 'สร้าง', cancelButtonText: 'ยกเลิก' }).then(r => {
    if (!r.isConfirmed) return;
    google.script.run.withSuccessHandler(res => { showToast(res, 'info'); }).setupCurriculumDatabase();
  });
}

function openPromotionModal() {
  const input = document.getElementById('confirmPromoteInput');
  const btn = document.getElementById('btnExecutePromotion');
  
  // ล้างค่าเก่าและปิดปุ่มไว้ก่อน
  if(input) input.value = '';
  if(btn) {
    btn.disabled = true;
    btn.classList.remove('btn-success');
    btn.classList.add('btn-danger');
  }

  // ผูก Event ดักจับการพิมพ์
  if(input) {
    input.oninput = function() {
      // ต้องพิมพ์ CONFIRM พิมพ์ใหญ่เป๊ะๆ เท่านั้น
      if (this.value === 'CONFIRM') {
        btn.disabled = false;
        btn.classList.remove('btn-danger');
        btn.classList.add('btn-success');
      } else {
        btn.disabled = true;
        btn.classList.add('btn-danger');
        btn.classList.remove('btn-success');
      }
    };
  }

  const modal = new bootstrap.Modal(document.getElementById('promotionModal'));
  modal.show();
}

function executePromotion() {
  const btn = document.getElementById('btnExecutePromotion');
  const originalText = btn.innerHTML;

  btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>กำลังประมวลผลทั้งโรงเรียน...';
  btn.disabled = true;

  google.script.run
    .withFailureHandler(err => {
      btn.innerHTML = originalText;
      btn.disabled = false;
      showToast('❌ ขัดข้อง: ' + err.message, 'danger');
    })
    .withSuccessHandler(res => {
      btn.innerHTML = originalText;
      if (res.status === 'success') {
        // ปิด Modal
        const modalEl = document.getElementById('promotionModal');
        const modalObj = bootstrap.Modal.getInstance(modalEl);
        if (modalObj) modalObj.hide();
        
        // 🌟 โชว์สรุปผลให้แอดมินดูแบบชัดเจน
        showAlert(res.message); 
        
        loadUserData(true);
      } else {
        btn.disabled = false;
        // ถ้าขึ้น Error จากหลังบ้าน (เช่น ลืมเปลี่ยนปีการศึกษา) จะเด้ง Alert
        showAlert(res.message);
      }
    })
    .promoteStudentsToNextYear();
}

function loadClubList() {
  const tbody = document.getElementById('clubListBody');
  if (!tbody) return;
  const user = JSON.parse(localStorage.getItem('pssms_user'));
  tbody.innerHTML = _skelTbody(5);

  google.script.run.withSuccessHandler(list => {
    _clubList = list || [];
    renderClubList(_clubList);

    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger p-5">❌ ${err.message}</td></tr>`;

function updateClubStats(list) {
  const total = list.length;
  const open = list.filter(c => c.status === 'open').length;
  const members = list.reduce((s, c) => s + c.memberCount, 0);
  const seats = list.reduce((s, c) => s + c.seatsLeft, 0);
  document.getElementById('statClubTotal').textContent = total;
  document.getElementById('statClubOpen').textContent = open;
  document.getElementById('statClubMembers').textContent = members;
  document.getElementById('statClubSeats').textContent = seats;
}

function renderClubList(list) {
  const tbody = document.getElementById('clubListBody');
  if (!tbody) return;
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted p-5"><i class="fas fa-inbox fa-3x opacity-25 mb-2 d-block"></i>ยังไม่มีชุมนุมในเทอมนี้ — กด "เพิ่มชุมนุม"</td></tr>';
    return;
  }
  let html = '';
  list.forEach(c => {
    const advHTML = c.advisors.length === 0
      ? '<span class="text-muted small">ยังไม่มี</span>'
      : c.advisors.map(a => `<span class="badge bg-light text-dark border me-1 mb-1">${a.teacherName || a.teacherId}</span>`).join('');
    const statusBadge = {
      'open': '<span class="badge bg-success">เปิด</span>',
      'closed': '<span class="badge bg-secondary">ปิด</span>',
      'locked': '<span class="badge bg-dark">ล็อค</span>'
    }[c.status] || `<span class="badge bg-light text-dark">${c.status}</span>`;
    const capColor = c.full ? 'text-danger fw-bold' : 'text-primary';
    html += `<tr>
      <td class="ps-3">
        <div class="fw-bold">${escapeHtmlSafe(c.clubName)}</div>
        ${c.description ? `<div class="small text-muted">${escapeHtmlSafe(c.description)}</div>` : ''}
      </td>
      <td>${advHTML}</td>
      <td class="text-center"><span class="${capColor}">${c.memberCount}/${c.capacity || '∞'}</span></td>
      <td class="text-center">${statusBadge}</td>
      <td class="text-end pe-3" style="white-space: nowrap">
        <button class="btn btn-sm btn-outline-primary me-1" onclick="openClubMembers('${c.clubId}', '${escapeAttr(c.clubName)}', '${c.term}', '${c.year}')"><i class="fas fa-users"></i></button>
        <button class="btn btn-sm btn-outline-warning me-1" onclick="openClubModal('${c.clubId}')"><i class="fas fa-edit"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteClubBtn('${c.clubId}', '${escapeAttr(c.clubName)}')"><i class="fas fa-trash"></i></button>
      </td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

function escapeHtmlSafe(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function escapeAttr(s) { return escapeHtmlSafe(s).replace(/'/g, '&#39;'); }
function jsArgAttr(s) { return escapeAttr(JSON.stringify(String(s == null ? '' : s))); }

window.filterClubList = (typeof debounce === 'function') ? debounce(_filterClubListImpl, 180) : _filterClubListImpl;
function _filterClubListImpl() {
  const q = (document.getElementById('clubSearchInput').value || '').toLowerCase();
  const filtered = _clubList.filter(c =>
    c.clubName.toLowerCase().includes(q) ||
    (c.description || '').toLowerCase().includes(q) ||
    c.advisors.some(a => (a.teacherName || '').toLowerCase().includes(q))
  );
  renderClubList(filtered);
}

function openClubModal(clubId) {
  document.getElementById('clubFormId').value = clubId || '';

function renderAdvisorList(list) {
  const box = document.getElementById('clubFormAdvisors');
  if (!box) return;

    box.innerHTML = '<div class="text-muted text-center p-3">ไม่พบรายชื่อครู</div>';

  }

function toggleAdvisor(teacherId, on) {
  if (on) _clubSelectedAdvisors[teacherId] = true;
  else delete _clubSelectedAdvisors[teacherId];
}

window.filterAdvisorList = (typeof debounce === 'function') ? debounce(_filterAdvisorListImpl, 150) : _filterAdvisorListImpl;
function _filterAdvisorListImpl() {
  const q = (document.getElementById('clubAdvisorSearch').value || '').toLowerCase();

function submitClubForm() {
  const user = JSON.parse(localStorage.getItem('pssms_user'));
  const clubId = document.getElementById('clubFormId').value;
  const clubName = document.getElementById('clubFormName').value.trim();
  if (!clubName) { showAlert('กรุณากรอกชื่อชุมนุม'); return; }

  const advisors = Object.keys(_clubSelectedAdvisors).map(tid => {
    const t = _clubTeacherList.find(x => x.id === tid);
    return { teacherId: tid, teacherName: t ? t.name : tid, role: 'หัวหน้า' };
  });

  const payload = {
    clubId: clubId,
    clubName: clubName,
    description: document.getElementById('clubFormDesc').value.trim(),
    capacity: parseInt(document.getElementById('clubFormCapacity').value) || 0,
    status: document.getElementById('clubFormStatus').value,
    term: user.currentTerm,
    year: user.currentYear,
    advisors: advisors
  };

  const btn = document.getElementById('clubFormSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>กำลังบันทึก...';

  const onDone = (res) => {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save me-1"></i>บันทึก';
    if (res.status === 'success') {
      bootstrap.Modal.getInstance(document.getElementById('clubModal')).hide();
      loadClubList();
    } else {
      showAlert('❌ ' + res.message);
    }
  };

  if (clubId) google.script.run.withSuccessHandler(onDone).updateClub(payload);
  else google.script.run.withSuccessHandler(onDone).createClub(payload);
}

}

function loadClubMembersData(onDone) {
  if (!_currentClubForMembers) return;
  const { clubId, term, year } = _currentClubForMembers;
  google.script.run
    .withSuccessHandler(members => {
      console.log('[Clubs] success handler fired, count:', members ? members.length : 'null', 'box:', !!document.getElementById('clubMembersList'));
      _clubMembersCache = members || [];
      try { renderClubMembersList(_clubMembersCache); } catch(e) { console.error('[Clubs] render error:', e); }

    })
    .withFailureHandler(err => {
      const box = document.getElementById('clubMembersList');
      if (box) box.innerHTML = `<div class="text-danger p-3 small">❌ โหลดไม่สำเร็จ: ${err.message}</div>`;

function renderClubMembersList(members) {
  const box = document.getElementById('clubMembersList');
  const countEl = document.getElementById('clubMembersCount');
  if (!box) return;
  if (countEl) countEl.textContent = members.length;
  if (!members.length) {
    box.innerHTML = '<div class="text-muted text-center p-3"><i class="fas fa-inbox fa-2x opacity-25 mb-2 d-block"></i>ยังไม่มีสมาชิก</div>';
    return;
  }
  // group by class
  const byClass = {};
  members.forEach(m => { (byClass[m.className] = byClass[m.className] || []).push(m); });
  const classKeys = Object.keys(byClass).sort();
  let html = '';
  classKeys.forEach(cls => {
    html += `<div class="border-bottom mb-2 pb-1"><strong class="small text-primary">ห้อง ${escapeHtmlSafe(cls)} <span class="text-muted">(${byClass[cls].length} คน)</span></strong></div>`;
    byClass[cls].forEach(m => {
      const tag = m.registeredBy === 'admin' ? '<span class="badge bg-info ms-1" style="font-size:0.65rem;">admin</span>' : '';
      html += `<div class="d-flex justify-content-between align-items-center small py-1 border-bottom border-light">
        <div><span class="text-muted me-2">${escapeHtmlSafe(m.studentId)}</span> ${escapeHtmlSafe(m.studentName)} ${tag}</div>
        <button class="btn btn-sm btn-outline-danger" style="font-size:0.7rem;padding:0.1rem 0.4rem;" onclick="adminRemoveMemberBtn('${escapeAttr(m.studentId)}', '${escapeAttr(m.studentName)}')"><i class="fas fa-times"></i></button>
      </div>`;
    });
  });
  box.innerHTML = html;
}

function loadMembersStudentList() {
  const cls = document.getElementById('clubMembersClassFilter').value;
  const box = document.getElementById('clubMembersStudentList');
  if (!cls) { box.innerHTML = '<div class="text-muted text-center p-3 small">เลือกชั้นเรียนก่อน</div>'; return; }
  const existing = new Set(_clubMembersCache.map(m => String(m.studentId).replace(/'/g, '').trim()));
  const students = (allUsers || []).filter(u => String(u[3]).toLowerCase() === 'student' && String(u[4]) === cls);
  if (!students.length) { box.innerHTML = '<div class="text-muted text-center p-3 small">ไม่พบนักเรียนในชั้นนี้</div>'; return; }
  box.innerHTML = students.map(s => {
    const sid = String(s[0]).replace(/'/g, '').trim();
    const taken = existing.has(sid);
    return `<div class="d-flex justify-content-between align-items-center small py-1 border-bottom border-light">
      <div><span class="text-muted me-2">${escapeHtmlSafe(sid)}</span> ${escapeHtmlSafe(s[2])}</div>
      ${taken ? '<span class="badge bg-success">อยู่แล้ว</span>' : `<button class="btn btn-sm btn-outline-success" style="font-size:0.7rem;padding:0.1rem 0.5rem;" onclick="adminAddMemberBtn('${escapeAttr(sid)}', '${escapeAttr(s[2])}')"><i class="fas fa-plus"></i></button>`}
    </div>`;
  }).join('');
}

function adminAddMemberBtn(studentId, studentName) {
  if (!_currentClubForMembers) return;
  const clubId = _currentClubForMembers.clubId;

  // Optimistic update — show immediately, sync later
  const student = (allUsers || []).find(u => String(u[0]).replace(/'/g, '').trim() === studentId);
  const className = student ? String(student[4]) : '';
  const tempMember = { studentId, studentName: student ? String(student[2]) : studentName, className, registeredBy: 'admin', registeredAt: '' };
  if (!_clubMembersCache.find(m => m.studentId === studentId)) {
    _clubMembersCache = [..._clubMembersCache, tempMember];
    renderClubMembersList(_clubMembersCache);
    loadMembersStudentList();
  }

  google.script.run
    .withSuccessHandler(res => {
      if (res && (res.status === 'success' || res.status === 'already')) {
        loadClubMembersData(loadMembersStudentList);
        loadClubList();
      } else {
        // Rollback optimistic update
        _clubMembersCache = _clubMembersCache.filter(m => m.studentId !== studentId);
        renderClubMembersList(_clubMembersCache);
        loadMembersStudentList();
        showAlert('❌ ' + (res ? res.message : 'ไม่ทราบสาเหตุ'));
      }
    })
    .withFailureHandler(err => {
      _clubMembersCache = _clubMembersCache.filter(m => m.studentId !== studentId);
      renderClubMembersList(_clubMembersCache);
      loadMembersStudentList();
      showAlert('❌ เพิ่มสมาชิกล้มเหลว: ' + err.message);
    })
    .adminAddMember(clubId, studentId);
}

function adminRemoveMemberBtn(studentId, studentName) {
  Swal.fire({ title: `ลบ ${studentName} ออกจากชุมนุม?`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก' }).then(r => {
    if (!r.isConfirmed) return;
    google.script.run.withSuccessHandler(res => {
      if (res.status === 'success') { loadClubMembersData(); loadClubList(); setTimeout(loadMembersStudentList, 400); }
      else showAlert('❌ ' + res.message);
    }).adminRemoveMember(_currentClubForMembers.clubId, studentId);
  });
}

    if (!payload || !payload.clubs) { showAlert('ไม่สามารถดึงข้อมูลได้'); return; }

    csv += 'ชุมนุม,ครูที่ปรึกษา,รหัสประจำตัว,ชื่อ-สกุล,ห้อง,สมัครเมื่อ,สมัครโดย\n';

function ttoRenderGrid() {
  var wrap = document.getElementById('ttoGridWrap');
  if (!wrap) return;
  var filterTeacher = document.getElementById('ttoFilterTeacher').value;
  var rows = filterTeacher ? _ttoAllRows.filter(function(r) { return String(r.data[5]).trim() === filterTeacher; }) : _ttoAllRows;

  // Build map: day+period → [{subjectName, level, room, teacherName}]
  var teacherMap = {};
  _ttoTeachers.forEach(function(t) { teacherMap[t.id] = t.name; });

  var map = {};
  rows.forEach(function(r) {
    var d = r.data;
    var day = String(d[6]).trim();
    var period = String(d[7]).trim();
    var key = day + '|' + period;
    if (!map[key]) map[key] = [];
    map[key].push({
      subject: String(d[1]).trim(),
      level: String(d[2]).trim(),
      room: String(d[3]).trim(),
      teacherId: String(d[5]).trim(),
      teacherName: teacherMap[String(d[5]).trim()] || String(d[5]).trim()
    });

  html += '<thead><tr><th style="width:80px;">คาบ</th>';
  TTO_DAYS.forEach(function(d) { html += '<th>' + d + '</th>'; });
  html += '</tr></thead><tbody>';

  TTO_PERIODS.forEach(function(p) {
    if (p === 5) {
      html += '<tr style="background:#fefce8;"><td colspan="5" class="text-center text-muted small py-1" style="font-size:.75rem;">— พักกลางวัน —</td></tr>';
    }
    html += '<tr>';
    html += '<td class="fw-bold" style="background:var(--p-subtle);">คาบ ' + p + '<br><span class="text-muted" style="font-size:.7rem;">' + (TTO_TIMES[p]||'') + '</span></td>';
    TTO_DAYS.forEach(function(day) {
      var key = day + '|' + p;
      var entries = map[key] || [];
      if (entries.length === 0) {
        html += '<td style="color:var(--p-border-strong);">—</td>';
      } else {
        html += '<td style="vertical-align:top;padding:4px 6px;">';
        entries.forEach(function(e) {

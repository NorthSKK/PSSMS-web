<div class="container-fluid pssms-page pssms-dept-academic">
  <div class="pssms-page-header">
    <div>
      <h4><i class="fas fa-chart-pie me-2" style="color: var(--p-accent);"></i>รายงานสถิติเวลาเรียน</h4>
      <p class="pssms-subtitle">ตรวจสิทธิ์สอบ — ปกติ ≥80% · มส. 60-79% · เรียนซ้ำ &lt;60%</p>
    </div>
  </div>

  <div class="pssms-card mb-3 py-2">
    <div class="row g-2 align-items-center">
      <div class="col-md-6">
        <select id="reportClassSelect" class="form-select form-select-sm" onchange="generateReport()">
          <option value="">-- กำลังโหลดรายวิชา... --</option>
        </select>
      </div>
      <div class="col-md-4">
        <div class="input-group input-group-sm">
          <select id="reportTerm" class="form-select text-center fw-medium" onchange="reloadReportSubjects()">
            <option value="1">เทอม 1</option>
            <option value="2" selected>เทอม 2</option>
          </select>
          <input type="number" id="reportYear" class="form-control text-center fw-medium" value="2568" onchange="reloadReportSubjects()">
        </div>
      </div>
      <div class="col-md-2">
        <button class="btn btn-accent btn-sm w-100" onclick="generateReport()">
          <i class="fas fa-sync-alt me-1"></i>ประมวลผล
        </button>
      </div>
    </div>
  </div>

  <!-- แถบสรุป — render โดย renderReportTable / renderAllSubjectsReportTable -->
  <div id="reportSummaryInfo"></div>

  <div class="pssms-card p-0">
    <div class="ar-scroll">
      <table class="ar-table">
        <thead>
          <tr>
            <th class="ar-col-no">ที่</th>
            <th class="ar-col-name">นักเรียน</th>
            <th class="ar-w">มา <span class="ar-sep">·</span> สาย</th>
            <th class="ar-w">ลา <span class="ar-sep">·</span> ขาด</th>
            <th class="ar-w">โควตา</th>
            <th class="ar-w">เวลาเรียน</th>
          </tr>
        </thead>
        <tbody id="reportTableBody">
          <tr><td colspan="6" class="ar-empty">เลือกวิชาด้านบนเพื่อเริ่มดูรายงาน</td></tr>
        </tbody>
      </table>
    </div>
    <div class="ar-legend">
      <span class="ar-key ar-ok">ปกติ &gt;85%</span>
      <span class="ar-key ar-watch">เฝ้าระวัง 80-85%</span>
      <span class="ar-key ar-ms">มส. 60-79%</span>
      <span class="ar-key ar-out">หมดสิทธิ์ &lt;60%</span>
      <span class="ms-auto">โควตา = จำนวนคาบที่ขาด/ลาได้อีกก่อนหมดสิทธิ์</span>
    </div>
  </div>
</div>

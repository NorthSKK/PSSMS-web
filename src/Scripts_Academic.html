function initAcademicReportPage() {
  // ดึงค่าเทอมและปีปัจจุบันของครูมาใส่ในช่อง
  const user = getSessionUser();
  if(user) {
    const termEl = document.getElementById('reportTerm');
    const yearEl = document.getElementById('reportYear');
    if(termEl) termEl.value = user.currentTerm;
    if(yearEl) yearEl.value = user.currentYear;
  }
  reloadReportSubjects(); 
}

function reloadReportSubjects() {
  const termEl = document.getElementById('reportTerm');
  const yearEl = document.getElementById('reportYear');
  const select = document.getElementById('reportClassSelect');
  if(!termEl || !yearEl || !select) return;
  
  const term = termEl.value; 
  const year = yearEl.value; 
  const user = getSessionUser();

  select.innerHTML = `<option value="">⏳ กำลังโหลดวิชา...</option>`; 
  select.disabled = true;
  
  const tbody = document.getElementById('reportTableBody');
  if(tbody) tbody.innerHTML = '<tr><td colspan="6" class="ar-empty">กรุณาเลือกวิชา</td></tr>';

  const summaryDiv = document.getElementById('reportSummaryInfo');
  if(summaryDiv) summaryDiv.innerHTML = '';

  const subjectCacheKey = `report_subjects_${user.id}_${term}_${year}`;
  const cachedSubjects = sessionStorage.getItem(subjectCacheKey);
  
  if (cachedSubjects) { 
      buildReportSubjectDropdown(JSON.parse(cachedSubjects), term, year); 
      return; 
  }

  google.script.run
    .withFailureHandler(err => { 
        select.innerHTML = '<option value="">❌ เกิดข้อผิดพลาด</option>'; 
        select.disabled = false; 
        showAlert("ไม่สามารถดึงรายวิชาได้: " + err.message); 
    })
    .withSuccessHandler(subjects => { 
        sessionStorage.setItem(subjectCacheKey, JSON.stringify(subjects)); 
        buildReportSubjectDropdown(subjects, term, year); 
    })
    .getTeacherSubjects(user.id, user.role, term, year);
}

function buildReportSubjectDropdown(subjects, term, year) {
  const select = document.getElementById('reportClassSelect');
  select.disabled = false;
  if(!subjects || subjects.length === 0) { 
      select.innerHTML = `<option value="">⚠️ ไม่พบวิชาในเทอม ${term}/${year}</option>`; 
      return; 
  }
  
  let html = '<option value="">-- เลือกรายวิชา --</option><option value="ALL" class="fw-bold text-white bg-primary">ดูทุกรายวิชาที่สอน (รวมทั้งหมด)</option>';
  subjects.forEach(sub => { 
      html += `<option value='${JSON.stringify(sub)}'>${sub[0]} - ${sub[3]} (${sub[1]})</option>`; 
  });
  select.innerHTML = html;
}

function generateReport() {
  const val = document.getElementById('reportClassSelect').value;
  if(!val) { showAlert("กรุณาเลือกรายวิชาก่อนครับ"); return; }
  
  const term = document.getElementById('reportTerm').value; 
  const year = document.getElementById('reportYear').value; 
  const user = getSessionUser();
  showLoader(true);

  if (val === "ALL") {
    google.script.run
      .withFailureHandler(err => { showLoader(false); showAlert("Error: " + err.message); })
      .withSuccessHandler(function(res) { 
          try { renderAllSubjectsReportTable(res); } 
          catch (e) { showLoader(false); console.error(e); } 
      })
      .getAllSubjectsReport(user.id, term, year);
  } else {
    try {
      const item = JSON.parse(val); 
      google.script.run
        .withFailureHandler(err => { showLoader(false); showAlert("Error: " + err.message); })
        .withSuccessHandler(function(res) { 
            try { renderReportTable(res, item[0], item[1], item[2]); } 
            catch (e) { showLoader(false); console.error(e); } 
        })
        .getSemesterReport(item[0], item[2], term, year);
    } catch (e) { 
        showLoader(false); 
        showAlert("ข้อมูลรายวิชาไม่ถูกต้อง: " + e.message); 
    }
  }
}

// ── ตัวช่วยร่วมของรายงานสถิติเวลาเรียน (ar-*) ──────────────
// เกณฑ์ต้องตรงกับของเดิมเป๊ะ: >85 ปกติ, >=80 เฝ้าระวัง, >=60 มส., ต่ำกว่านั้นหมดสิทธิ์
function _arBucket(p) {
  if (p > 85) return 'ok';
  if (p >= 80) return 'watch';
  if (p >= 60) return 'ms';
  return 'out';
}

const AR_LABEL = { ok: 'ปกติ', watch: 'เฝ้าระวัง', ms: 'มส.', out: 'หมดสิทธิ์' };

// 0 = ไม่มีอะไรต้องดู ทำจางไว้; ที่ไม่ใช่ 0 ขึ้นเป็นเม็ดสีให้กวาดตาเจอในตารางยาว ๆ
// ห่อ .ar-slot กว้างคงที่เท่ากับหัวตาราง ไม่งั้นเม็ดสีกว้างไม่เท่ากันแล้ว label ไม่ตรงคอลัมน์
function _arNum(n, cls) {
  const v = Number(n) || 0;
  const inner = v ? `<span class="ar-pill ${cls}">${v}</span>` : `<span class="ar-zero">${v}</span>`;
  return `<span class="ar-slot">${inner}</span>`;
}

// เตือนตอนโควตาใกล้หมด ไม่ใช่รอจนเกินแล้วค่อยแดง
const AR_QUOTA_LOW = 3;

// 1 แถว = 1 นักเรียน — % เป็นตัวบอกสถานะในตัว เลยไม่ต้องมีคอลัมน์ badge แยก
function _arRow(s, index, remainingQuota) {
  const p = parseFloat(s.percent);
  const b = _arBucket(p);
  const rowCls = (b === 'ms' || b === 'out') ? ` ar-row-${b}` : '';
  const quota = (remainingQuota < 0)
    ? `<span class="ar-quota ar-quota-bad">เกิน ${Math.abs(remainingQuota)}</span>`
    : (remainingQuota <= AR_QUOTA_LOW)
      ? `<span class="ar-quota ar-quota-warn">เหลือ ${remainingQuota}</span>`
      : `<span class="ar-quota">เหลือ ${remainingQuota}</span>`;

  return `<tr class="ar-std${rowCls}" data-bucket="${b}">
    <td class="ar-col-no ar-no">${index}</td>
    <td class="ar-col-name">
      <div class="ar-name text-truncate" style="max-width:200px;">${s.name}</div>
      <div class="ar-sid">${s.id}</div>
    </td>
    <td class="ar-num">${_arNum(s.present, 'ar-present')}${_arNum(s.late, 'ar-late')}</td>
    <td class="ar-num">${_arNum(s.leave, 'ar-leave')}${_arNum(s.absent, 'ar-miss')}</td>
    <td>${quota}</td>
    <td><span class="ar-pct ar-${b}" title="${AR_LABEL[b]}">${s.percent}%</span></td>
  </tr>`;
}

// ชิปนับจำนวน — แทนการ์ดรายชื่อ 3 ใบเดิม กดแล้วกรองตารางแทนการอ่านรายชื่อซ้ำ
function _arChips(counts) {
  return ['ok', 'watch', 'ms', 'out'].map(b =>
    `<span class="ar-chip ar-${b}" data-bucket="${b}" onclick="filterReportByBucket('${b}')">
      ${AR_LABEL[b]} <b>${counts[b]}</b>
    </span>`).join('');
}

let _arActiveFilter = '';

// ── คัดลอกรายชื่อส่ง LINE / Facebook ───────────────────────
// รูปแบบข้อความเดียวกับ copyAtRiskList ของ "กระดานแจ้งเตือนกลุ่มเสี่ยง" ในแดชบอร์ด
// เก็บแถวที่ render ล่าสุดไว้ (แนบ subjectCode/subjectName/className ครบทุกแถว)
// แบบเดียวกับที่แดชบอร์ดเก็บ window.currentAtRiskData
let _arRows = [];
let _arGroupKeys = [];

const _arKey = (s) => `${s.subjectCode}|||${s.subjectName || s.subjectCode}|||${s.className || 'ไม่ระบุห้อง'}`;

function _arCopyBtn(groupIdx, title) {
  return `<button class="ar-copy" title="${title}" onclick="event.stopPropagation();copyReportList(${groupIdx === null ? "''" : groupIdx})">
    <i class="fas fa-copy"></i></button>`;
}

// groupIdx = '' → ทุกวิชาที่แสดงอยู่, ตัวเลข → เฉพาะวิชานั้น. ทั้งคู่เคารพชิปกรองที่เลือกไว้
window.copyReportList = function(groupIdx) {
  let rows = _arRows;
  if (_arActiveFilter) rows = rows.filter(s => _arBucket(parseFloat(s.percent)) === _arActiveFilter);
  if (groupIdx !== '' && groupIdx !== undefined && groupIdx !== null) {
    rows = rows.filter(s => _arKey(s) === _arGroupKeys[groupIdx]);
  }

  if (rows.length === 0) {
    const msg = _arActiveFilter ? `ไม่มีนักเรียนกลุ่ม "${AR_LABEL[_arActiveFilter]}"` : 'ไม่มีนักเรียนให้คัดลอก';
    if (typeof showToast === 'function') showToast(msg, 'info'); else showAlert(msg);
    return;
  }

  const grouped = {};
  rows.forEach(s => { (grouped[_arKey(s)] = grouped[_arKey(s)] || []).push(s); });

  const scope = _arActiveFilter ? `กลุ่ม ${AR_LABEL[_arActiveFilter]}` : 'ทุกกลุ่ม';
  let text = `📊 รายงานสถิติเวลาเรียน — ${scope}\n`;
  text += `----------------------------------\n`;
  Object.keys(grouped).sort().forEach(key => {
    const [subCode, subName, cls] = key.split('|||');
    text += `📚 ${subName} (${subCode}) — ห้อง ${cls}\n`;
    grouped[key].forEach(s => {
      const q = Number(s.remainingQuota);
      const quota = isNaN(q) ? ''
        : q < 0 ? ` ⛔ เกินโควตา ${Math.abs(q)} คาบ`
        : q <= AR_QUOTA_LOW ? ` ⚠️ เหลือโควตา ${q} คาบ`
        : ` เหลือโควตา ${q} คาบ`;
      text += `   - ${s.id} ${s.name} — ${s.percent}% (ขาด ${s.absent}, ลา ${s.leave})${quota}\n`;
    });
    text += `\n`;
  });
  text += `----------------------------------\n`;
  text += `⚠️ รบกวนนักเรียนที่มีรายชื่อ ติดต่อครูผู้สอนด่วนครับ!`;

  navigator.clipboard.writeText(text).then(() => {
    const m = `✅ คัดลอกรายชื่อ ${rows.length} คน สำเร็จ!`;
    if (typeof showToast === 'function') showToast(m, 'success'); else showAlert(m);
  }).catch(err => {
    showAlert('❌ เบราว์เซอร์ไม่รองรับการคัดลอก กรุณาเปลี่ยนเบราว์เซอร์ครับ: ' + err);
  });
}

function filterReportByBucket(bucket) {
  _arActiveFilter = (_arActiveFilter === bucket) ? '' : bucket;

  document.querySelectorAll('#reportSummaryInfo .ar-chip').forEach(c =>
    c.classList.toggle('ar-on', c.dataset.bucket === _arActiveFilter));

  const rows = document.querySelectorAll('#reportTableBody tr.ar-std');
  rows.forEach(r => {
    r.style.display = (!_arActiveFilter || r.dataset.bucket === _arActiveFilter) ? '' : 'none';
  });

  // หัวกลุ่มวิชาที่ไม่เหลือนักเรียนแล้วต้องหายไปด้วย ไม่งั้นเหลือหัวลอย ๆ
  document.querySelectorAll('#reportTableBody tr.ar-group').forEach(g => {
    let visible = false;
    for (let el = g.nextElementSibling; el && !el.classList.contains('ar-group'); el = el.nextElementSibling) {
      if (el.style.display !== 'none') { visible = true; break; }
    }
    g.style.display = visible ? '' : 'none';
  });
}

function _arResetFilter() { _arActiveFilter = ''; _arRows = []; _arGroupKeys = []; }

function renderReportTable(res, subjectCode, subjectName, className) {
  showLoader(false);
  const tbody = document.getElementById('reportTableBody');
  const info = document.getElementById('reportSummaryInfo');
  if (!tbody) return;
  _arResetFilter();
  if (info) info.innerHTML = '';

  if (!res || !res.students || res.students.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="ar-empty">ไม่พบข้อมูลการเช็คชื่อในรายวิชานี้</td></tr>';
    return;
  }

  const data = res.students;
  const meta = res.meta || { periodsPerWeek: 0, totalCoursePeriods: 0, maxAbsenceQuota: 0, currentTotalTaught: 0 };
  const taught = meta.currentTotalTaught;
  const total = meta.totalCoursePeriods;
  const progressPercent = total > 0 ? Math.min((taught / total) * 100, 100).toFixed(1) : 0;
  const remaining = total - taught;

  const counts = { ok: 0, watch: 0, ms: 0, out: 0 };
  data.forEach(s => counts[_arBucket(parseFloat(s.percent))]++);

  if (info) {
    info.innerHTML = `<div class="ar-bar">
      <span class="ar-bar-title">${subjectCode} ${subjectName} · ${className}</span>
      <span class="ar-bar-meta">สอนแล้ว ${taught}/${total} คาบ (เหลือ ${remaining > 0 ? remaining : 0})</span>
      <div class="ar-taught" title="สอนไปแล้ว ${progressPercent}%"><span style="width:${progressPercent}%"></span></div>
      <span class="ar-bar-meta">ขาดได้ ${meta.maxAbsenceQuota} ครั้ง</span>
      <div class="ar-chips">${_arChips(counts)}${_arCopyBtn(null, 'คัดลอกรายชื่อส่งไลน์/เฟซบุ๊ก')}</div>
    </div>`;
  }

  data.sort((a, b) => String(a.id || "").localeCompare(String(b.id || ""), 'th', { numeric: true }));

  // มุมมองวิชาเดียว — แถวไม่มี subjectCode/className/remainingQuota ติดมาจาก getSemesterReport
  // ต้องแนบเองให้ข้อความที่คัดลอกครบ (เรียงหลัง sort ให้ลำดับตรงกับตาราง)
  _arRows = data.map(s => ({
    ...s, subjectCode, subjectName, className,
    remainingQuota: meta.maxAbsenceQuota - ((s.leave || 0) + (s.absent || 0)),
  }));

  tbody.innerHTML = _arRows.map((s, i) => _arRow(s, i + 1, s.remainingQuota)).join('');
}

function renderAllSubjectsReportTable(data) {
  showLoader(false);
  const tbody = document.getElementById('reportTableBody');
  const info = document.getElementById('reportSummaryInfo');
  if (!tbody) return;
  _arResetFilter();
  if (info) info.innerHTML = '';

  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="ar-empty">ไม่พบข้อมูลการเช็คชื่อในเทอมนี้</td></tr>';
    return;
  }

  const counts = { ok: 0, watch: 0, ms: 0, out: 0 };
  data.forEach(s => counts[_arBucket(parseFloat(s.percent))]++);

  if (info) {
    info.innerHTML = `<div class="ar-bar">
      <span class="ar-bar-title">ทุกรายวิชาที่สอน</span>
      <span class="ar-bar-meta">${data.length} รายการ</span>
      <div class="ar-chips">${_arChips(counts)}${_arCopyBtn(null, 'คัดลอกรายชื่อทุกวิชาที่แสดงอยู่')}</div>
    </div>`;
  }

  _arRows = data;

  let html = '', currentGroup = '', studentIndex = 1;
  data.forEach(s => {
    const groupKey = `${s.subjectCode}_${s.className}`;
    if (groupKey !== currentGroup) {
      studentIndex = 1;
      // ปุ่มบนหัวกลุ่ม = คัดลอกเฉพาะวิชานั้น (ยังเคารพชิปกรองที่เลือกไว้)
      const gi = _arGroupKeys.push(_arKey(s)) - 1;
      html += `<tr class="ar-group"><td colspan="6">
        <i class="fas fa-book-open me-1"></i>${s.subjectCode} ${s.subjectName}
        <span class="ar-group-meta">· ห้อง ${s.className} · สอนแล้ว ${s.taught} คาบ</span>
        ${_arCopyBtn(gi, `คัดลอกรายชื่อเฉพาะ ${s.subjectCode} ห้อง ${s.className}`)}
      </td></tr>`;
      currentGroup = groupKey;
    }
    html += _arRow(s, studentIndex++, s.remainingQuota);
  });

  tbody.innerHTML = html;
}

function openDetailedLessonModal() {
  var topic = document.getElementById('inputTopic').value;
  if(!topic) { showAlert('กรุณากรอก "หัวข้อที่สอน" ก่อนกดบันทึกแบบละเอียด'); document.getElementById('inputTopic').focus(); return; }
  if(sigCanvas && sigCanvas.toDataURL().length < 1000) { showAlert('กรุณาลงชื่อผู้สอนก่อน'); return; }
  document.getElementById('detailedLessonForm').reset();
  new bootstrap.Modal(document.getElementById('detailedLessonModal')).show();
}

async function submitDetailedLesson() {
  var classVal = document.getElementById('selectClass').value;
  if(!classVal) { showAlert('กรุณาเลือกวิชาก่อน'); return; }
  var item = JSON.parse(classVal);
  var topic = document.getElementById('inputTopic').value;
  var dateInput = document.getElementById('teachingDate');
  var user = getSessionUser();
  var date = (dateInput && dateInput.value) ? dateInput.value : new Date().toISOString().split('T')[0];
  var normalizedClassName = getRealClassName();

  var dpaValues = Array.from(document.querySelectorAll('.dpa-check:checked')).map(function(el){ return el.value; });
  var skillValues = Array.from(document.querySelectorAll('.skill-check:checked')).map(function(el){ return el.value; });
  var workFile = document.getElementById('dl_work_file').files[0];
  var imageFile = document.getElementById('dl_image_file').files[0];

  var submitBtn = document.querySelector('#detailedLessonModal .btn-primary');
  var originalBtnText = submitBtn.innerHTML;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังบันทึก...';
  showLoader(true);

  try {
    var workFileBase64 = await getBase64(workFile);
    var imageFileBase64 = await getBase64(imageFile);

    var detailedRecord = {
      date: date, subjectCode: item[0], subjectName: item[1], className: normalizedClassName, period: item[5], topic: topic, teacherId: user.id,
      outcomes: document.getElementById('dl_outcomes').value,
      problems: document.getElementById('dl_problems').value,
      solutions: document.getElementById('dl_solutions').value,
      dpa: dpaValues, skills: skillValues,
      studentResults: document.getElementById('dl_student_results').value,
      workFileBase64: workFileBase64, imageFileBase64: imageFileBase64
    };

    var attendanceBatch = currentStudents.map(function(s) {
      var statusEl = document.querySelector('input[name="status_' + s[0] + '"]:checked');
      return { date: date, term: user.currentTerm, year: user.currentYear, subjectCode: item[0], subjectName: item[1], className: normalizedClassName, period: item[5], studentId: s[0], studentName: s[2], status: statusEl ? statusEl.value : 'มา', teacherId: user.id };
    });

    var lateCount = document.querySelectorAll('input[value="สาย"]:checked').length;
    var leaveCount = document.querySelectorAll('input[value="ลา"]:checked').length;
    var basicRecord = {
      date: date, term: user.currentTerm, year: user.currentYear,
      subjectCode: item[0], subjectName: item[1], className: normalizedClassName, period: item[5], topic: topic,
      present: parseInt(document.getElementById('sumPresent').innerText) + lateCount,
      absent: parseInt(document.getElementById('sumAbsent').innerText) || 0, leave: leaveCount,
      teacherId: user.id, signature: sigCanvas ? sigCanvas.toDataURL() : ''
    };

    google.script.run.withSuccessHandler(function() {
      google.script.run.withSuccessHandler(function() {
        google.script.run.withSuccessHandler(function(res) {
          showLoader(false);
          bootstrap.Modal.getInstance(document.getElementById('detailedLessonModal')).hide();
          sessionStorage.removeItem('risk_dash_' + user.id + '_' + user.currentTerm + '_' + user.currentYear);
          sessionStorage.removeItem('lesson_history_' + user.id + '_' + user.currentTerm + '_' + user.currentYear);
          showAlert(res.message);
          loadPage('Page_Dashboard_Teacher');
        }).saveDetailedLessonRecord(detailedRecord);
      }).saveLessonRecord(basicRecord);
    }).saveAttendanceBatch(attendanceBatch);

  } catch(err) {
    showLoader(false); submitBtn.disabled = false; submitBtn.innerHTML = originalBtnText;
    showAlert('เกิดข้อผิดพลาด: ' + err.message);
  }
}


// ============================================================
// กระดานติดตามงานครู — Page_Teacher_Progress
//
// ทั้งกระดานเป็น "ความคืบหน้า" ไม่มีไฟแดง: ตัวเลขบอกว่าไปถึงไหน ไม่ตัดสินว่าใครผิด
// grade_summary เก็บเฉพาะแถวที่กรอกครบอยู่แล้ว แถวว่างกลางเทอมแปลว่ายังไม่ถึงเวลา
// เหตุผลเต็ม ๆ อยู่ที่ docs/plan-teacher-progress-board.md
// ============================================================

var _tpData = null;
var _tpOpen = {};   // teacherId → กางอยู่ไหม (คงไว้ข้ามการโหลดใหม่)

function initTeacherProgressPage(force) {
  var body = document.getElementById('tpBody');
  if (!body) return;
  if (force) {
    body.innerHTML = '<tr><td colspan="4" class="p-3"><div class="pssms-skel" style="height:38px;border-radius:8px;"></div></td></tr>';
  }
  google.script.run
    .withSuccessHandler(function(res) { _tpData = res; _tpRender(); })
    .withFailureHandler(function(err) {
      body.innerHTML = '';
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 4;
      td.className = 'text-center text-muted py-4';
      td.textContent = 'โหลดกระดานไม่สำเร็จ: ' + (err && err.message ? err.message : err);
      tr.appendChild(td); body.appendChild(tr);
    })
    .getTeacherProgressBoard();
}

// เม็ดวัด — % เป็นตัวหลัก (ใช้กวาดตาเทียบครูหลายคน) เศษส่วนเป็นตัวรอง (ใช้ตอนจะไปคุยกับเจ้าตัว)
// expected=0 แปลว่า "ไม่มีให้ทำ" ไม่ใช่ "ทำไม่ครบ" — ขึ้น — ไม่ใช่ 0%
function _tpMeterCell(m, unit) {
  var td = document.createElement('td');
  if (!m || !m.expected) {
    var na = document.createElement('span');
    na.className = 'tp-meter-na';
    na.textContent = '—';
    na.title = 'ไม่มีรายการที่ต้องทำในช่องนี้';
    td.appendChild(na);
    return td;
  }
  var pct = Math.round((m.done / m.expected) * 100);
  var wrap = document.createElement('div');
  wrap.className = 'tp-meter' + (m.done >= m.expected ? ' tp-meter-full' : '');

  var pctEl = document.createElement('span');
  pctEl.className = 'tp-meter-pct';
  pctEl.textContent = pct + '%';

  var bar = document.createElement('div');
  bar.className = 'tp-meter-bar';
  var fill = document.createElement('span');
  fill.style.width = pct + '%';
  bar.appendChild(fill);

  wrap.appendChild(pctEl); wrap.appendChild(bar);
  td.appendChild(wrap);
  td.title = m.done.toLocaleString() + ' จาก ' + m.expected.toLocaleString() + (unit ? ' ' + unit : '');
  return td;
}

var TP_UNITS = { attendance: 'คาบ', config: 'วิชา', scores: 'คน' };

function _tpTotalBlock(label, m, unit) {
  var box = document.createElement('div');
  box.className = 'tp-total';
  var lb = document.createElement('span');
  lb.className = 'tp-total-label';
  lb.textContent = label;
  box.appendChild(lb);
  var cell = _tpMeterCell(m, unit);
  while (cell.firstChild) box.appendChild(cell.firstChild);
  return box;
}

function _tpRender() {
  var d = _tpData;
  var body = document.getElementById('tpBody');
  var totals = document.getElementById('tpTotals');
  var sub = document.getElementById('tpSubtitle');
  if (!d || !body) return;

  if (sub) {
    sub.textContent = 'ภาคเรียนที่ ' + d.term + '/' + d.year + ' · ครู ' + d.teachers.length + ' คน'
      + (d.datedTerm ? '' : ' · ยังไม่ได้ตั้งวันเปิด-ปิดภาคเรียน คอลัมน์เช็คชื่อจึงว่าง');
  }

  if (totals) {
    totals.innerHTML = '';
    totals.appendChild(_tpTotalBlock('เช็คชื่อ', d.totals.attendance, TP_UNITS.attendance));
    totals.appendChild(_tpTotalBlock('ตั้งค่าวิชา', d.totals.config, TP_UNITS.config));
    totals.appendChild(_tpTotalBlock('กรอกคะแนน', d.totals.scores, TP_UNITS.scores));
  }

  body.innerHTML = '';
  if (!d.teachers.length) {
    var empty = document.createElement('tr');
    var etd = document.createElement('td');
    etd.colSpan = 4;
    etd.className = 'text-center text-muted py-4';
    etd.textContent = 'ยังไม่มีตารางสอนของภาคเรียนนี้';
    empty.appendChild(etd); body.appendChild(empty);
    return;
  }

  d.teachers.forEach(function(t) {
    var tr = document.createElement('tr');
    tr.className = 'tp-row-teacher';
    tr.onclick = function() { _tpToggle(t.teacherId); };

    var nameTd = document.createElement('td');
    var caret = document.createElement('span');
    caret.className = 'tp-caret';
    caret.textContent = _tpOpen[t.teacherId] ? '▾' : '▸';
    var nm = document.createElement('span');
    nm.className = 'tp-name';
    nm.textContent = t.name;
    nameTd.appendChild(caret); nameTd.appendChild(nm);
    tr.appendChild(nameTd);
    tr.appendChild(_tpMeterCell(t.attendance, TP_UNITS.attendance));
    tr.appendChild(_tpMeterCell(t.config, TP_UNITS.config));
    tr.appendChild(_tpMeterCell(t.scores, TP_UNITS.scores));
    body.appendChild(tr);

    if (!_tpOpen[t.teacherId]) return;
    t.subjects.forEach(function(s) {
      var sr = document.createElement('tr');
      sr.className = 'tp-row-subject';
      var std = document.createElement('td');
      std.className = 'tp-sub-name';
      std.textContent = s.isHomeroom ? 'โฮมรูม' : (s.subjectName + ' (' + s.subjectCode + ')');
      var cls = document.createElement('div');
      cls.className = 'tp-sub-class';
      cls.textContent = s.className;
      std.appendChild(cls);
      sr.appendChild(std);
      sr.appendChild(_tpMeterCell(s.attendance, TP_UNITS.attendance));
      sr.appendChild(_tpMeterCell(s.config, TP_UNITS.config));
      sr.appendChild(_tpMeterCell(s.scores, TP_UNITS.scores));
      body.appendChild(sr);
    });
  });
}

function _tpToggle(teacherId) {
  _tpOpen[teacherId] = !_tpOpen[teacherId];
  _tpRender();
}


// ============================================================
// ติดตามนักเรียนรายวัน — Page_Student_Watch
//
// แสดง "เฉพาะเด็กที่มีอาการ" โรงเรียน 600 คน วันปกติมีอาการ 10-30 คน
// อาการมาจาก functions/studentWatch.js `classify()` ฝั่ง server ที่เดียว
// ห้ามคำนวณอาการซ้ำฝั่ง client — สองสูตรจะ drift แล้วหน้าจอกับรายงานเถียงกัน
// ============================================================

var SW_LABEL = {
  away: 'ขาดโรงเรียน',
  fled: 'มาแล้วหนี',
  skip: 'โดด',
  late: 'สาย',
};
// เรียงจากหนักไปเบา — ใช้ทั้งชิปนับและป้ายในแถว
var SW_ORDER = ['away', 'fled', 'skip', 'late'];
// คำอธิบายสั้นใต้หัวการ์ด — ชื่ออาการอย่างเดียวตีความผิดได้ง่าย โดยเฉพาะ
// "ขาดโรงเรียน" กับ "มาแล้วหนี" ที่ต่างกันแค่ว่าเข้าแถวหรือเปล่า
var SW_DESC = {
  away: 'ไม่มาโรงเรียนเลยทั้งวัน — ทุกคาบที่เช็คแล้วเป็นขาด และไม่ได้เข้าแถว',
  fled: 'มาถึงโรงเรียนแล้วแต่ไม่เข้าเรียนสักคาบ — เข้าแถวแล้ว แต่ทุกคาบเป็นขาด',
  skip: 'มาเรียนบางคาบ หายบางคาบในวันเดียวกัน — ครูกดโดดเอง หรือระบบสรุปจากคาบอื่น',
  late: 'มีคาบที่ครูกดว่ามาสาย',
};

var _swData = null;
var _swFilter = '';

function swShiftDay(delta) {
  var el = document.getElementById('swDate');
  if (!el || !el.value) return;
  var d = new Date(el.value + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + delta);
  setDateValue('swDate', d.toISOString().slice(0, 10));
  initStudentWatchPage();
}

function swToday() {
  setDateValue('swDate', '');
  _swData = null;
  initStudentWatchPage();
}

function initStudentWatchPage() {
  var list = document.getElementById('swList');
  if (!list) return;
  // ตัวเดียวกับที่ใช้บนหน้าปฏิทินและแดชบอร์ด — ไม่ส่ง cfg จะยิง getSystemConfig เอง
  // (PUBLIC + cache 300s) · ตัดสินใจซ่อน/แสดงเองเมื่อไม่มี TermData
  if (typeof renderTermProgressBar === 'function') renderTermProgressBar('swTermProgress');
  list.innerHTML = '<div class="pssms-skel mb-2" style="height:52px;border-radius:8px;"></div>'
                 + '<div class="pssms-skel" style="height:52px;border-radius:8px;"></div>';
  var el = document.getElementById('swDate');
  google.script.run
    .withSuccessHandler(function(res) {
      _swData = res;
      // เปิดหน้ามาไม่ได้เลือกวัน — เติมวันที่ server ตัดสินว่าเป็น "วันนี้" กลับเข้าช่อง
      if (el && !el.value && res && res.date) setDateValue('swDate', res.date);
      _swRender();
    })
    .withFailureHandler(function(err) {
      list.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'text-center text-muted py-4';
      p.textContent = 'โหลดไม่สำเร็จ: ' + (err && err.message ? err.message : err);
      list.appendChild(p);
    })
    .getDailyStudentWatch(el && el.value ? el.value : null);
}

function _swChip(key, count) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'ar-chip sw-chip-' + key + (_swFilter === key ? ' ar-on' : '');
  b.onclick = function() { _swFilter = (_swFilter === key) ? '' : key; _swRender(); };
  b.appendChild(document.createTextNode(SW_LABEL[key] + ' '));
  var n = document.createElement('b');
  n.textContent = count;
  b.appendChild(n);
  return b;
}

function _swRender() {
  var d = _swData;
  var list = document.getElementById('swList');
  var chips = document.getElementById('swChips');
  var sub = document.getElementById('swSubtitle');
  if (!d || !list) return;

  if (sub) {
    sub.textContent = d.students.length
      ? ('มีนักเรียนที่ต้องดู ' + d.students.length + ' คน จากที่เช็คชื่อแล้ว ' + d.checkedStudents + ' คน')
      : ('เช็คชื่อแล้ว ' + d.checkedStudents + ' คน ไม่มีใครมีอาการ');
  }

  if (chips) {
    chips.innerHTML = '';
    var title = document.createElement('span');
    title.className = 'ar-bar-title';
    title.textContent = _swThaiDate(d.date);
    chips.appendChild(title);
    var wrap = document.createElement('div');
    wrap.className = 'ar-chips';
    SW_ORDER.forEach(function(k) { wrap.appendChild(_swChip(k, d.counts[k] || 0)); });
    chips.appendChild(wrap);
  }

  var rows = _swFilter
    ? d.students.filter(function(s) { return s.symptoms.indexOf(_swFilter) >= 0; })
    : d.students;

  list.innerHTML = '';
  if (!rows.length) {
    var empty = document.createElement('div');
    empty.className = 'pssms-card p-4 text-center text-muted';
    empty.textContent = d.checkedStudents
      ? 'ไม่มีนักเรียนที่เข้าเงื่อนไขในวันนี้'
      : 'ยังไม่มีการเช็คชื่อของวันนี้';
    list.appendChild(empty);
    return;
  }

  // จัดกลุ่มตามห้อง — ฝ่ายปกครองทำงานเป็นห้อง ไม่ใช่เป็นรายชื่อยาว
  var byClass = [];
  var idx = {};
  rows.forEach(function(s) {
    if (!(s.className in idx)) { idx[s.className] = byClass.length; byClass.push({ cls: s.className, items: [] }); }
    byClass[idx[s.className]].items.push(s);
  });

  byClass.forEach(function(g) {
    var card = document.createElement('div');
    card.className = 'pssms-card mb-3';

    var head = document.createElement('div');
    head.className = 'pssms-card-header d-flex justify-content-between align-items-center';
    var h = document.createElement('span');
    h.textContent = g.cls || '(ไม่ระบุห้อง)';
    var cnt = document.createElement('span');
    cnt.className = 'small text-muted';
    cnt.textContent = g.items.length + ' คน';
    head.appendChild(h); head.appendChild(cnt);
    card.appendChild(head);

    g.items.forEach(function(s) { card.appendChild(_swStudentRow(s)); });
    list.appendChild(card);
  });
}

function _swStudentRow(s) {
  var row = document.createElement('div');
  row.className = 'sw-row';
  row.onclick = function() { openStudentProfile(s.studentId, s.name); };

  var left = document.createElement('div');
  left.className = 'sw-row-main';
  var nm = document.createElement('div');
  nm.className = 'sw-name';
  nm.textContent = s.name;
  var id = document.createElement('span');
  id.className = 'sw-id';
  id.textContent = ' ' + s.studentId;
  nm.appendChild(id);
  left.appendChild(nm);

  var tags = document.createElement('div');
  tags.className = 'sw-tags';
  SW_ORDER.forEach(function(k) {
    if (s.symptoms.indexOf(k) < 0) return;
    var t = document.createElement('span');
    t.className = 'sw-tag sw-tag-' + k;
    t.textContent = SW_LABEL[k];
    tags.appendChild(t);
  });
  if (s.missedPeriods && s.missedPeriods.length) {
    var pd = document.createElement('span');
    pd.className = 'sw-periods';
    pd.textContent = 'คาบ ' + s.missedPeriods.join(', ');
    tags.appendChild(pd);
  }
  left.appendChild(tags);

  var strip = document.createElement('div');
  strip.className = 'sw-strip';
  (s.periods || []).forEach(function(p) {
    var cell = document.createElement('span');
    cell.className = 'sw-cell sw-' + _swStatusKey(p.status);
    cell.textContent = p.period;
    cell.title = 'คาบ ' + p.period + ' · ' + (p.subjectName || p.subjectCode || '') + ' · ' + p.status;
    strip.appendChild(cell);
  });

  row.appendChild(left);
  row.appendChild(strip);
  return row;
}

function _swStatusKey(st) {
  if (st === 'มา') return 'ok';
  if (st === 'สาย') return 'late';
  if (st === 'โดด') return 'skip';
  if (st === 'ขาด') return 'absent';
  return 'other';
}

function _swThaiDate(iso) {
  var m = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var d = new Date(iso + 'T00:00:00Z');
  var days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  return days[d.getUTCDay()] + 'ที่ ' + d.getUTCDate() + ' ' + m[d.getUTCMonth()] + ' ' + (d.getUTCFullYear() + 543);
}

// ---------------------------------------------------- ประวัติสะสมรายคน

function openStudentProfile(studentId, name) {
  var body = document.getElementById('swProfileBody');
  var title = document.getElementById('swProfileTitle');
  if (!body) return;
  if (title) title.textContent = name + ' · ' + studentId;
  body.innerHTML = '<div class="pssms-skel" style="height:120px;border-radius:8px;"></div>';
  var modal = new bootstrap.Modal(document.getElementById('swProfileModal'));
  modal.show();

  google.script.run
    .withSuccessHandler(function(p) { _swRenderProfile(p); })
    .withFailureHandler(function(err) {
      body.innerHTML = '';
      body.textContent = 'โหลดไม่สำเร็จ: ' + (err && err.message ? err.message : err);
    })
    .getStudentAttendanceProfile(studentId, user.currentTerm, user.currentYear);
}

function _swRenderProfile(p) {
  var body = document.getElementById('swProfileBody');
  if (!body || !p) return;
  body.innerHTML = '';

  var sum = document.createElement('div');
  sum.className = 'sw-prof-sum';
  SW_ORDER.forEach(function(k) {
    var box = document.createElement('div');
    box.className = 'sw-prof-stat';
    var n = document.createElement('div');
    n.className = 'sw-prof-num sw-tag-' + k;
    n.textContent = p.totals[k] || 0;
    var l = document.createElement('div');
    l.className = 'sw-prof-lab';
    l.textContent = SW_LABEL[k] + (k === 'late' || k === 'skip' ? ' (วัน)' : ' (วัน)');
    box.appendChild(n); box.appendChild(l);
    sum.appendChild(box);
  });
  body.appendChild(sum);

  body.appendChild(_swRank('คาบที่หายบ่อย', p.byPeriod.map(function(r) {
    return { label: 'คาบ ' + r.period, count: r.count };
  })));
  body.appendChild(_swRank('วิชาที่หายบ่อย', p.bySubject.map(function(r) {
    return { label: (r.subjectName || r.subjectCode), count: r.count };
  })));

  var h = document.createElement('div');
  h.className = 'sw-prof-head';
  h.textContent = 'รายวัน (' + p.days.length + ' วันที่มีอาการ)';
  body.appendChild(h);

  if (!p.days.length) {
    var none = document.createElement('div');
    none.className = 'text-muted small';
    none.textContent = 'ไม่มีวันที่เข้าเงื่อนไขในภาคเรียนนี้';
    body.appendChild(none);
    return;
  }
  p.days.forEach(function(d) {
    var r = document.createElement('div');
    r.className = 'sw-prof-day';
    var dt = document.createElement('span');
    dt.className = 'sw-prof-date';
    dt.textContent = _swThaiDate(d.date);
    r.appendChild(dt);
    SW_ORDER.forEach(function(k) {
      if (d.symptoms.indexOf(k) < 0) return;
      var t = document.createElement('span');
      t.className = 'sw-tag sw-tag-' + k;
      t.textContent = SW_LABEL[k];
      r.appendChild(t);
    });
    if (d.missedPeriods.length) {
      var pd = document.createElement('span');
      pd.className = 'sw-periods';
      pd.textContent = 'คาบ ' + d.missedPeriods.join(', ');
      r.appendChild(pd);
    }
    body.appendChild(r);
  });
}

function _swRank(title, items) {
  var wrap = document.createElement('div');
  if (!items.length) return wrap;
  var h = document.createElement('div');
  h.className = 'sw-prof-head';
  h.textContent = title;
  wrap.appendChild(h);
  var max = items[0].count || 1;
  items.slice(0, 5).forEach(function(it) {
    var row = document.createElement('div');
    row.className = 'sw-rank';
    var lab = document.createElement('span');
    lab.className = 'sw-rank-lab';
    lab.textContent = it.label;
    var bar = document.createElement('span');
    bar.className = 'sw-rank-bar';
    var fill = document.createElement('span');
    fill.style.width = Math.round((it.count / max) * 100) + '%';
    bar.appendChild(fill);
    var n = document.createElement('span');
    n.className = 'sw-rank-num';
    n.textContent = it.count;
    row.appendChild(lab); row.appendChild(bar); row.appendChild(n);
    wrap.appendChild(row);
  });
  return wrap;
}


// ---------------------------------------------------- แท็บสะสม (อันดับ)
//
// 4 ลิสต์แยกตามอาการ ไม่รวมเป็นคะแนนเดียว — น้ำหนักแบบ "โดด 2 = ขาด 1" ไม่มีฐานอ้างอิง
// และแต่ละอาการนำไปสู่คนละการกระทำ (โทรผู้ปกครอง / ตามหาในโรงเรียน / คุยกับเด็ก)
//
// ⚠️ ห้ามเติมคอลัมน์ % เวลาเรียนที่นี่ — docs/adr/0002-*

var _swTab = 'daily';
var _swWindow = '30';   // '7' | '30' | 'term' | 'YYYY-MM'
var _swRank = null;

function swShowTab(tab) {
  _swTab = tab;
  var daily = document.getElementById('swPaneDaily');
  var rank  = document.getElementById('swPaneRank');
  if (!daily || !rank) return;
  daily.classList.toggle('d-none', tab !== 'daily');
  rank.classList.toggle('d-none', tab !== 'rank');
  var td = document.getElementById('swTabDaily');
  var tr = document.getElementById('swTabRank');
  if (td) td.classList.toggle('active', tab === 'daily');
  if (tr) tr.classList.toggle('active', tab === 'rank');
  // ตัวเลื่อนวันเป็นของแท็บรายวันอย่างเดียว
  var nav = document.querySelector('.sw-daynav');
  if (nav) nav.classList.toggle('d-none', tab !== 'daily');
  if (tab === 'rank' && !_swRank) _swLoadRank();
}

function swSetWindow(range) {
  // ช่อง dropdown ส่ง '' มาตอนเลือกหัวข้อ "รายเดือน…" — ไม่ต้องทำอะไร
  if (!range) { _swSyncWindowUI(); return; }
  _swWindow = String(range);
  _swRank = null;
  _swLoadRank();
}

// ไฮไลต์ปุ่ม/ค่า dropdown ให้ตรงกับช่วงที่เลือกอยู่ — เลือกเดือนแล้วปุ่มต้องคลาย
// และกดปุ่มแล้ว dropdown ต้องกลับไปที่ "รายเดือน…" ไม่งั้นดูเหมือนเลือกไว้สองอย่าง
function _swSyncWindowUI() {
  ['7', '30', 'term'].forEach(function(r) {
    var b = document.getElementById('swWin' + r);
    if (b) b.classList.toggle('btn-accent', r === _swWindow);
  });
  var sel = document.getElementById('swMonth');
  if (sel) sel.value = (_swWindow.indexOf('-') > 0) ? _swWindow : '';
}

function _swFillMonths(months) {
  var sel = document.getElementById('swMonth');
  if (!sel || !months) return;
  if (sel.dataset.filled === String(months.length)) return;   // เติมครั้งเดียวพอ
  sel.innerHTML = '';
  var head = document.createElement('option');
  head.value = '';
  head.textContent = 'รายเดือน…';
  sel.appendChild(head);
  months.forEach(function(m) {
    var o = document.createElement('option');
    o.value = m.value;
    o.textContent = m.label;
    sel.appendChild(o);
  });
  sel.dataset.filled = String(months.length);
  _swSyncWindowUI();
}

function _swLoadRank() {
  var grid = document.getElementById('swRankGrid');
  if (!grid) return;
  _swSyncWindowUI();
  grid.innerHTML = '<div class="col-12"><div class="pssms-skel" style="height:180px;border-radius:8px;"></div></div>';
  google.script.run
    .withSuccessHandler(function(res) { _swRank = res; _swFillMonths(res.months); _swRenderRank(); })
    .withFailureHandler(function(err) {
      grid.innerHTML = '';
      var p = document.createElement('div');
      p.className = 'col-12 text-center text-muted py-4';
      p.textContent = 'โหลดไม่สำเร็จ: ' + (err && err.message ? err.message : err);
      grid.appendChild(p);
    })
    .getStudentWatchRanking(_swWindow);
}

function _swRenderRank() {
  var r = _swRank;
  var grid = document.getElementById('swRankGrid');
  var meta = document.getElementById('swRankMeta');
  if (!r || !grid) return;

  if (meta) {
    // ช่วงจริงที่นับ ไม่ใช่แค่ชื่อปุ่ม — "30 วัน" กับ "ส.ค." ต้องอ่านออกว่าครอบวันไหนบ้าง
    var span = r.from
      ? (_swThaiDate(r.from) + (r.to ? ' – ' + _swThaiDate(r.to) : ' ถึงวันนี้'))
      : 'ทั้งภาคเรียน';
    meta.textContent = span + ' · มีข้อมูลนักเรียน ' + r.studentsWithData + ' คน';
  }

  grid.innerHTML = '';
  SW_ORDER.forEach(function(k) {
    var col = document.createElement('div');
    col.className = 'col-12 col-lg-6';
    var card = document.createElement('div');
    card.className = 'pssms-card h-100 p-0';

    var head = document.createElement('div');
    head.className = 'pssms-card-header d-flex justify-content-between align-items-center';
    var badge = document.createElement('span');
    badge.className = 'sw-tag sw-tag-' + k;
    badge.textContent = SW_LABEL[k];
    head.appendChild(badge);
    var n = document.createElement('span');
    n.className = 'small text-muted';
    n.textContent = r.lists[k].length ? (r.lists[k].length + ' คน') : '';
    head.appendChild(n);
    card.appendChild(head);

    var desc = document.createElement('div');
    desc.className = 'sw-card-desc';
    desc.textContent = SW_DESC[k];
    card.appendChild(desc);

    if (!r.lists[k].length) {
      var none = document.createElement('div');
      none.className = 'p-3 small text-muted';
      none.textContent = 'ไม่มีใครถึงเกณฑ์ ' + r.minOccurrences + ' วันขึ้นไป';
      card.appendChild(none);
    } else {
      r.lists[k].forEach(function(s, i) { card.appendChild(_swRankRow(s, i, k)); });
    }
    col.appendChild(card);
    grid.appendChild(col);
  });
}

function _swRankRow(s, i, symptom) {
  var row = document.createElement('div');
  row.className = 'sw-rank-row';
  row.onclick = function() { openStudentProfile(s.studentId, s.name); };

  var pos = document.createElement('span');
  pos.className = 'sw-rank-pos';
  pos.textContent = (i + 1);

  var mid = document.createElement('div');
  mid.className = 'sw-rank-mid';
  var nm = document.createElement('div');
  nm.className = 'sw-name';
  nm.textContent = s.name;
  var sub = document.createElement('div');
  sub.className = 'sw-rank-sub';
  sub.textContent = s.className + ' · ล่าสุด ' + _swThaiDate(s.lastDate);
  mid.appendChild(nm); mid.appendChild(sub);

  var right = document.createElement('div');
  right.className = 'sw-rank-count';
  var big = document.createElement('span');
  big.className = 'sw-rank-big sw-tag-' + symptom;
  big.textContent = s.count;
  var den = document.createElement('span');
  den.className = 'sw-rank-den';
  den.textContent = '/ ' + s.daysWithData + ' วัน';
  right.appendChild(big); right.appendChild(den);
  right.title = s.count + ' วันที่มีอาการ จาก ' + s.daysWithData + ' วันที่ครูเช็คชื่อ';

  row.appendChild(pos); row.appendChild(mid); row.appendChild(right);
  return row;
}

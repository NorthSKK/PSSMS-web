<div class="container-fluid pssms-page pssms-dept-general">
  <div class="pssms-page-header d-flex align-items-start justify-content-between gap-3">
    <div><h4><i class="fas fa-folder-tree me-2" style="color:#6f42c1"></i>เอกสารโครงการ</h4>
      <p class="pssms-subtitle mb-0">คลังเอกสารโครงการกลางของโรงเรียน</p></div>
    <button id="projectNewButton" class="btn btn-accent fw-bold" onclick="openProjectDocumentForm()"><i class="fas fa-plus me-1"></i>เพิ่มโครงการ</button>
  </div>
  <div class="alert alert-light border small mb-3"><i class="fas fa-users me-1 text-primary"></i>บุคลากรทุกคนเปิดดูและดาวน์โหลดได้ · แก้ไขหรืออัปโหลดได้เฉพาะเจ้าของโครงการและผู้ดูแลระบบ</div>
  <div id="projectDocumentsList" class="row g-3"><div class="col-12 text-center text-muted py-5"><div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลดเอกสารโครงการ...</div></div>
</div>

<div class="modal fade pssms-modal" id="projectDocumentModal" tabindex="-1" aria-hidden="true">
 <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h6 class="modal-title fw-bold">ข้อมูลโครงการ</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><input type="hidden" id="projectDocumentId">
   <div class="mb-3"><label class="form-label small">ชื่อโครงการ <span class="text-danger">*</span></label><input class="form-control" id="projectDocumentTitle" maxlength="160"></div>
   <div class="mb-3"><label class="form-label small">รายละเอียด</label><textarea class="form-control" id="projectDocumentDescription" rows="4" maxlength="2000"></textarea></div>
   <div class="mb-1"><label class="form-label small">แนบไฟล์เพิ่ม</label><input class="form-control" id="projectDocumentFiles" type="file" accept=".pdf,.jpg,.jpeg,.png,.docx" multiple></div>
   <div class="form-text">PDF, JPG, PNG หรือ Word (.docx) ขนาดไม่เกิน 100 MB ต่อไฟล์</div>
  </div>
  <div class="modal-footer border-0"><button class="btn btn-soft" data-bs-dismiss="modal">ยกเลิก</button><button class="btn btn-accent fw-bold" onclick="saveProjectDocumentForm()"><i class="fas fa-save me-1"></i>บันทึก</button></div>
 </div></div>
</div>
